name: CP3.6 chain after Train merge or spent native failure

on:
  workflow_run:
    workflows:
      - sandbox-train
      - "LF Worker native (trusted workflow_run or manual, no API)"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing trusted Train/native run ID; no arbitrary lot completion"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: cp36-chain-global
  cancel-in-progress: false

jobs:
  chain:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.run_attempt == 1 &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
    steps:
      - name: Checkout trusted main control; no proposals, no secrets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare isolated Git worktree identity and current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reconcile trusted merge, DAG, attempts; prepare draft successors only
        env:
          CP36_PACK_OUT: ${{ runner.temp }}/cp36-proposal-packs
        run: python3 pilot/orchestrator/chain_lots.py --source-run-id "$SOURCE_RUN_ID"
      - name: Publish only safe GPT task packs, not hidden tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp36-proposal-request-packs
          path: ${{ runner.temp }}/cp36-proposal-packs
          if-no-files-found: ignore
          retention-days: 30
      - name: Owner's approval remains mandatory
        if: always()
        run: |
          echo "CP36_OWNER_GATE: Claude reviews, Paulo labels ready-to-merge, Train merges."
