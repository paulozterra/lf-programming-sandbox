name: CP3.6 chain after Train merge or spent native failure
run-name: CP3.6 ${{ inputs.request_slug && format('{0} PR {1}', inputs.request_slug, inputs.merge_pr || inputs.integration_pr) || inputs.merge_pr && format('PR {0}', inputs.merge_pr) || inputs.integration_pr && format('PR {0}', inputs.integration_pr) || github.event.workflow_run.head_branch || inputs.source_run_id || github.run_id }}

on:
  workflow_run:
    workflows:
      - sandbox-train
      - ci
      - "LF Worker native (trusted workflow_run or manual, no API)"
    types: [completed]
  workflow_dispatch:
    inputs:
      merge_pr:
        description: Verified Train PR for audit correlation only
        required: false
        type: string
      source_run_id:
        description: "Existing trusted Train/native run ID; no arbitrary lot completion"
        required: false
        type: string
      integration_pr:
        description: "Optional Train-merged integration PR for recovery"
        required: false
        type: string
      request_slug:
        description: Request slug derived from the verified Train PR merge delta
        required: false
        type: string
      new_plan_request:
        description: Only set by verified generated-T7 Train handoff to open all lot exam requests
        required: false
        type: string
      base_sha:
        description: Exact Train merge commit with verified main CI
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: cp36-chain-global
  cancel-in-progress: false

jobs:
  chain:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.run_attempt == 1 ||
        github.event.workflow_run.name == 'ci') &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
      INTEGRATION_PR: ${{ inputs.integration_pr || '' }}
    steps:
      - name: Checkout trusted main control; no proposals, no secrets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned OpenAPI YAML reader (no model)
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Prepare isolated Git worktree identity and current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify exact CI-verified main merge SHA when Train gated
        if: ${{ inputs.base_sha != '' }}
        env:
          EXPECTED_BASE: ${{ inputs.base_sha }}
          REQUEST_SLUG: ${{ inputs.request_slug }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_SLUG" =~ ^req-[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          # CP3.6 retains its internal require_green_base call.
      - name: Reconcile trusted merge, DAG, attempts; prepare draft successors only
        env:
          CP36_PACK_OUT: ${{ runner.temp }}/cp36-proposal-packs
        run: |
          if [ -n "$INTEGRATION_PR" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --integration-pr "$INTEGRATION_PR"
          elif [ -n "${{ inputs.new_plan_request }}" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --source-run-id "$SOURCE_RUN_ID" \
              --new-plan-request "${{ inputs.new_plan_request }}" --new-plan-pr "${{ inputs.merge_pr }}"
          else
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --source-run-id "$SOURCE_RUN_ID"
          fi
      - name: Publish only safe GPT task packs, not hidden tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp36-proposal-request-packs
          path: ${{ runner.temp }}/cp36-proposal-packs
          if-no-files-found: ignore
          retention-days: 30
      - name: Owner's approval remains mandatory
        if: always()
        run: |
          echo "CP36_OWNER_GATE: Claude reviews, Paulo labels ready-to-merge, Train merges."
      - name: Wake stalled-request watchdog even on failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run request-failure-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
