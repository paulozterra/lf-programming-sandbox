name: CP3.6 chain after Train merge or spent native failure
run-name: CP3.6 ${{ inputs.sweep && format('sweep {0}', github.run_id) || inputs.request_slug && format('{0} PR {1}', inputs.request_slug, inputs.merge_pr || inputs.integration_pr) || inputs.merge_pr && format('PR {0}', inputs.merge_pr) || inputs.integration_pr && format('PR {0}', inputs.integration_pr) || github.event.workflow_run.head_branch || inputs.source_run_id || github.run_id }}

on:
  workflow_run:
    workflows:
      - sandbox-train
      - ci
      - "LF Worker native (trusted workflow_run or manual, no API)"
    types: [completed]
  workflow_dispatch:
    inputs:
      merge_pr:
        description: Verified Train PR for audit correlation only
        required: false
        type: string
      source_run_id:
        description: "Existing trusted Train/native run ID; no arbitrary lot completion"
        required: false
        type: string
      integration_pr:
        description: "Optional Train-merged integration PR for recovery"
        required: false
        type: string
      request_slug:
        description: Request slug derived from the verified Train PR merge delta
        required: false
        type: string
      new_plan_request:
        description: Only set by verified generated-T7 Train handoff to open all lot exam requests
        required: false
        type: string
      base_sha:
        description: Exact Train merge commit with verified main CI
        required: false
        type: string
      sweep:
        description: Resume all active requests after exact-main green CI
        required: false
        type: boolean
        default: false
      terminal_request:
        description: Owner-selected request for a terminal candidate (no automatic close)
        required: false
        type: string
      terminal_result:
        description: FAILED_FINAL or CANCELLED_FINAL; exact green main required
        required: false
        type: string
      retry_attempt:
        description: T27 bounded transient retry number, 0 through 2
        required: false
        type: string
        default: '0'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: cp36-chain-global
  cancel-in-progress: false

jobs:
  chain:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.run_attempt == 1 ||
        github.event.workflow_run.name == 'ci') &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
      INTEGRATION_PR: ${{ inputs.integration_pr || '' }}
      NEW_PLAN_REQUEST: ${{ inputs.new_plan_request || '' }}
      MERGE_PR: ${{ inputs.merge_pr || '' }}
    steps:
      - name: Checkout trusted main control; no proposals (only the read-only EKB secret, T56)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned OpenAPI YAML reader (no model)
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Prepare isolated Git worktree identity and current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify exact CI-verified main merge SHA when Train gated
        id: chain_base
        if: ${{ inputs.base_sha != '' }}
        env:
          EXPECTED_BASE: ${{ inputs.base_sha }}
          REQUEST_SLUG: ${{ inputs.terminal_request || inputs.request_slug }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          if [ "${{ inputs.sweep }}" != "true" ]; then
            [[ "$REQUEST_SLUG" =~ ^req-[1-9][0-9]*$ ]]
          fi
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$EXPECTED_BASE" ]; then
            # A queued global sweep may have been overtaken by another Train merge.
            # Only an ancestor is eligible; never retarget a request-specific handoff.
            test "${{ inputs.sweep }}" = "true"
            git merge-base --is-ancestor "$EXPECTED_BASE" "$head"
            echo "CP36_SWEEP_BASE_SUPERSEDED: $EXPECTED_BASE -> $head"
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          # process() independently checks live main and exact-SHA CI before any mutation.
      - name: Reconcile trusted merge, DAG, attempts; prepare draft successors only
        env:
          CP36_PACK_OUT: ${{ runner.temp }}/cp36-proposal-packs
          SWEEP_BASE: ${{ steps.chain_base.outputs.sha }}
          TERMINAL_REQUEST: ${{ inputs.terminal_request }}
          TERMINAL_RESULT: ${{ inputs.terminal_result }}
          TERMINAL_ACTOR: ${{ github.actor }}
          TERMINAL_OWNER: ${{ github.repository_owner }}
          # T56: read-only EKB secret for the lot's ekb.md. Only trusted main
          # code runs here (no proposal is executed); it never prints content.
          LF_EKB_READONLY_URL: ${{ secrets.LF_EKB_READONLY_URL }}
        run: |
          set -eo pipefail
          if [ -n "$TERMINAL_REQUEST$TERMINAL_RESULT" ]; then
            test "${{ github.event_name }}" = workflow_dispatch
            test "$TERMINAL_ACTOR" = "$TERMINAL_OWNER"
            test "${{ inputs.sweep }}" != true
            test -z "$INTEGRATION_PR$NEW_PLAN_REQUEST$SOURCE_RUN_ID$MERGE_PR"
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --terminal-request "$TERMINAL_REQUEST" --terminal-result "$TERMINAL_RESULT" --base-sha "$SWEEP_BASE"
          elif [ "${{ inputs.sweep }}" = "true" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --sweep --base-sha "$SWEEP_BASE" | tee "$RUNNER_TEMP/cp36-sweep-outcomes.json"
          elif [ -n "$INTEGRATION_PR" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --integration-pr "$INTEGRATION_PR"
          elif [ -n "$NEW_PLAN_REQUEST" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --source-run-id "$SOURCE_RUN_ID" \
              --new-plan-request "$NEW_PLAN_REQUEST" --new-plan-pr "$MERGE_PR"
          else
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/chain_lots.py --source-run-id "$SOURCE_RUN_ID"
          fi
      - name: T27 retry transient sweep on exact main, bounded by attempt
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.sweep == true && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.chain_base.outputs.sha }}
          RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/cp36-sweep-outcomes.json"
          test -f "$file" || exit 0
          python3 - "$file" "$RUNNER_TEMP/cp36-transient-requests.txt" <<'PY'
          import json, re, sys
          try:
              outcomes = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(0)
          transient = [
              row for row in outcomes
              if isinstance(row, dict)
              and isinstance(row.get("reason"), str)
              and row["reason"].startswith("GITHUB_TRANSITORIO:")
          ]
          requests = sorted({
              row["request"] for row in transient
              if isinstance(row.get("request"), str)
              and re.fullmatch(r"req-[1-9][0-9]*", row["request"])
          })
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write("\n".join(requests) if requests else
                           "GLOBAL" if transient else "")
          PY
          test -s "$RUNNER_TEMP/cp36-transient-requests.txt" || exit 0
          [[ "$RETRY_ATTEMPT" =~ ^[012]$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || exit 0
          if [ "$RETRY_ATTEMPT" -lt 2 ]; then
            sleep 180
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA" || exit 0
            gh workflow run chain-lots.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f sweep=true -f base_sha="$BASE_SHA" -f retry_attempt="$((RETRY_ATTEMPT + 1))"
          else
            # Terminal notice; the existing watchdog is still triggered below.
            while IFS= read -r request; do
              [[ "$request" == req-* ]] || continue
              number="${request#req-}"
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
                --body "<!-- LF_T27_TRANSIENT_EXHAUSTED:$BASE_SHA:$request --> GITHUB_TRANSITORIO: reintentos CP3.6 agotados para $BASE_SHA; requiere revisión del watchdog."
            done < "$RUNNER_TEMP/cp36-transient-requests.txt"
          fi
      - name: Publish only safe GPT task packs, not hidden tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp36-proposal-request-packs
          path: ${{ runner.temp }}/cp36-proposal-packs
          if-no-files-found: ignore
          retention-days: 30
      - name: Owner's approval remains mandatory
        if: always()
        run: |
          echo "CP36_OWNER_GATE: Claude reviews, Paulo labels ready-to-merge, Train merges."
      # A bot PR may have passed CI before this version of CP3.6 was merged.
      # Always wake the trusted-main Policy C sweep after a main sweep, even
      # when CP3.6 has no new work; Policy C is idempotent with zero candidates.
      - name: Wake policy C after every trusted-main CP3.6 sweep
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.sweep == true && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-integrate.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Wake stalled-request watchdog even on failure
        if: failure() || cancelled()  # CHG-0252: success needs no watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run request-failure-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$GITHUB_RUN_ID"
