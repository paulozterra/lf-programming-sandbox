name: CHG-0033 temporary derived registry render
on:
  pull_request:
    branches:
      - lf/chg-0033-retire-one-shot-palantir-gate
permissions:
  contents: write
jobs:
  render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lf/chg-0033-retire-one-shot-palantir-gate
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate CAMBIOS with official renderer
        run: |
          set -euo pipefail
          git fetch origin lf/chg-0033-retire-one-shot-palantir-gate
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/lf/chg-0033-retire-one-shot-palantir-gate)"
          python3 standards/tools/changes.py render
          python3 standards/tools/changes.py render --check
          git diff --name-only | grep -Fxq standards/CAMBIOS.md
          test "$(git diff --name-only | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standards/CAMBIOS.md
          git diff --cached --check
          git commit -m "CHG-0033: regenerate CAMBIOS.md via official changes.py"
          git push origin HEAD:lf/chg-0033-retire-one-shot-palantir-gate
