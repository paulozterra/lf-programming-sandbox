name: ci

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Bot request PR number for independent verification"
        required: false
        type: string
      pr_sha:
        description: "Exact bot request PR HEAD"
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # T27.1: Maven Central rate limits (HTTP 429/503) are transient; retry them
  # with backoff instead of failing main CI and stalling the request chain.
  MAVEN_ARGS: >-
    -Daether.transport.http.retryHandler.count=6
    -Daether.transport.http.retryHandler.interval=10000
    -Daether.transport.http.retryHandler.serviceUnavailable=429,503
concurrency:
  # Each Train merge SHA must complete its own main CI; later merges must not
  # cancel it. PR revisions retain cancellation to limit redundant usage.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  t37-historical-rehearsal:
    name: T37 historical reproduction (read-only, PR 800)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 800 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch trusted main and exact proposal data without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 pilot/orchestrator/route_tool_defect.py prove-preacceptance --task req652backend2 --run-id 45751249784 --current-base 6fca197fe23130793e747c8f81226c5755f53707 --reason "CHG-0554 historical rehearsal; NOT a registered recovery" > "$RUNNER_TEMP/t37-rehearsal.json"
          for historical_run in 45751028452 45751150685; do
            if python3 pilot/orchestrator/route_tool_defect.py prove-preacceptance --task req652backend2 --run-id "$historical_run" --current-base 6fca197fe23130793e747c8f81226c5755f53707 --reason "negative control" > "$RUNNER_TEMP/t37-negative.json" 2> "$RUNNER_TEMP/t37-negative.err"; then
              echo "T37_NEGATIVE_UNEXPECTED_ELIGIBILITY"
              exit 1
            fi
            grep -Fx 'T37_BLOCKED:NOT_A_PREACCEPTANCE_SIGNATURE_FAILURE' "$RUNNER_TEMP/t37-negative.err"
          done
          echo "T37_REHEARSAL_PASS: historical FAIL, isolated guard PASS, full corrected control PASS, two negative controls rejected"
          cat "$RUNNER_TEMP/t37-rehearsal.json"

  t9-request-equality:
    name: T9 request content byte equality
    if: startsWith(github.head_ref || github.ref_name, 'lf/request/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      PR_SHA: ${{ github.event.pull_request.head.sha || inputs.pr_sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Read trusted main code, never execute request PR files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Independently compare issue field to exact candidate blobs
        run: python3 -m pilot.workflow_entrypoint pilot/orchestrator/check_issue_request.py

  backend:
    name: backend (Maven verify)
    runs-on: ubuntu-24.04
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/lf_ci
      DB_USERNAME: pilot
      DB_PASSWORD: pilot
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot
          POSTGRES_DB: lf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d lf_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven Central mirror with Central fallback (T57)
        shell: bash
        run: |
          set -euo pipefail
          # Global settings apply to every mvn on this runner, including the
          # vendored Worker and exams that run with an isolated, empty HOME.
          maven_home="$(mvn -v | sed -n 's/^Maven home: //p')"
          test -n "$maven_home" && test -d "$maven_home/conf"
          sudo tee "$maven_home/conf/settings.xml" >/dev/null <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>lf-maven-mirror</id>
                <repositories>
                  <repository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>lf-maven-mirror</activeProfile>
            </activeProfiles>
          </settings>
          XML
          grep -q "maven-central.storage-download.googleapis.com" "$maven_home/conf/settings.xml"
      - name: STD-BE-05 Spotless/Palantir (required for time-service)
        working-directory: .
        run: mvn -U -B -q -f apps/time-service/pom.xml spotless:check
      - run: python3 ../standards/tools/stack_checks.py run --set spring-boot --check-id spring-verify
      - name: Compile and run staged reminders visible tests (no model)
        working-directory: .
        run: mvn -U -B -q -f apps/time-service/pom.xml test
      - name: DATA template psql in isolated Worker (disposable PostgreSQL)
        working-directory: .
        env:
          LF_TEST_REAL_WORKER_DB: "YES"
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt pytest==8.4.2
          python3 -m pytest -q pilot/worker_v08/test_worker_db_env.py pilot/worker_v08/test_fixture_credentials.py -p no:cacheprovider
      - name: "T2: verify live springdoc operations against every contract"
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt
          mvn -U -B -q -f apps/time-service/pom.xml spring-boot:start
          python3 -m pilot.workflow_entrypoint pilot/orchestrator/contract_validate.py --compare-live http://127.0.0.1:8080/v3/api-docs --defer-pending-backend
          if grep -q '<artifactId>spring-boot-starter-flyway</artifactId>' apps/time-service/pom.xml; then
            PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -U "$DB_USERNAME" -d lf_ci \
              -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) >= 0 FROM flyway_schema_history"
          fi
      - name: "T2: stop springdoc verification backend"
        if: always()
        working-directory: .
        run: mvn -B -q -f apps/time-service/pom.xml spring-boot:stop || true

  frontend:
    name: frontend (lint, tipos, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: T25 actual official OpenAPI generator from synthetic contract (offline)
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python3 -m pytest -q pilot/orchestrator/test_t25_contract_derivatives.py -k real_npm_gen_api -p no:cacheprovider
      - run: npm run gen:api
      - run: git diff --exit-code -- frontend/src/lib/api/generated
        working-directory: .
      - name: "T2: block stale types and manual API fetch"
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt
          python3 -m pilot.workflow_entrypoint pilot/orchestrator/contract_validate.py --check-client .
          python3 -m pilot.workflow_entrypoint pilot/orchestrator/contract_validate.py --check-frontend .
      - run: python3 ../standards/tools/stack_checks.py run --set nextjs --check-id next-lint
      - run: python3 ../standards/tools/stack_checks.py run --set nextjs --check-id next-typecheck
      - run: python3 ../standards/tools/stack_checks.py run --set nextjs --check-id next-build

  standards-catalog:
    name: estándares (catálogo y checks)
    runs-on: ubuntu-24.04
    outputs:
      policy_c_notify: ${{ steps.policy_c_branch.outputs.accepted }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Classify Policy C branch using authoritative allowlist
        id: policy_c_branch
        env:
          POLICY_C_BRANCH: ${{ github.ref_name }}
        run: python3 -m pilot.workflow_entrypoint pilot/policy_c_handoff.py --output "$GITHUB_OUTPUT"
      - run: python3 standards/tools/stack_checks.py validate --ci .github/workflows/ci.yml
      - run: python3 standards/tools/skills.py validate
      - name: "C6: ensamblado sintético Spring offline"
        run: |
          python3 -c 'import hashlib,json,pathlib; p=pathlib.Path("standards/catalog.json"); d=json.loads(p.read_text()); print(json.dumps({"catalog_version":d["catalog_version"],"catalog_sha256":hashlib.sha256(p.read_bytes()).hexdigest()}))' > /tmp/skill-pin.json
          python3 standards/tools/skills.py assemble --pin /tmp/skill-pin.json --skills spring-boot --domains STD-BE,STD-API,STD-SEC,STD-GEN,STD-LOG,STD-MSG,STD-AUD,STD-GIT --out /tmp/c6-spring.txt
          python3 standards/tools/skills.py assemble --pin /tmp/skill-pin.json --skills spring-boot --domains STD-BE,STD-API,STD-SEC,STD-GEN,STD-LOG,STD-MSG,STD-AUD,STD-GIT,STD-NAV,STD-CONS --out /tmp/c6-spring-all.txt
      - run: python3 standards/tools/consumption.py validate
      - run: python3 standards/tools/consumption.py render --check
      - name: Reject runner context in job env across all workflows
        run: python3 -m pilot.workflow_entrypoint pilot/check_workflow_job_env.py
      - name: Parse every GitHub Actions YAML and require jobs (offline, blocking)
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt
          python3 -m pilot.workflow_entrypoint pilot/test_workflow_yaml_policy.py
      - name: T54 phase 2b active project and storage path completeness
        run: python3 -m unittest discover -s pilot -p 'test_t54_phase2b.py' -v
      - name: T9.1 permissions for all workflows and synthetic regressions
        run: |
          python3 -m pilot.workflow_entrypoint pilot/test_workflow_permissions.py
          python3 -m unittest discover -s pilot -p 'test_workflow_permissions_cases.py' -v
          python3 -m unittest discover -s pilot -p 'test_request_failure_notify.py' -v
          python3 -m unittest discover -s pilot -p 'test_issue_intake_duplicate.py' -v
      - name: T9.2 no bot-only push and Train handoff stage regression tests
        run: |
          python3 -m pilot.workflow_entrypoint pilot/test_workflow_triggers.py
          python3 -m unittest discover -s pilot -p 'test_t9_2_handoff.py' -v
          python3 -m unittest discover -s pilot -p 'test_t9_2_stages.py' -v
      - name: T9.3 selector init, workflow policy and original T7 failure notification
        run: |
          python3 -m pilot.workflow_entrypoint pilot/test_selector_environment.py
          python3 -m unittest discover -s pilot -p 'test_t9_3_selector_notify.py' -v
      - name: T9.4 extract every Python workflow command and smoke in clean interpreters
        run: |
          python3 -m unittest discover -s pilot -p 'test_workflow_python_commands.py' -v
          python3 -m pilot.workflow_python_commands
      - name: T12 concurrent request recovery and exam issue idempotence
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt
          python3 -m unittest discover -s pilot -p 'test_t12_concurrency.py' -v
          python3 -m unittest discover -s pilot -p 'test_t14_exam_requests.py' -v
          python3 -m unittest discover -s pilot -p 'test_t15_sweep.py' -v
          python3 -m unittest discover -s pilot -p 'test_t17_3_sweep_wake.py' -v
      - name: T11 API field naming and independent exam orchestration (offline)
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt pytest==8.4.2
          python3 -m unittest discover -s pilot -p 'test_t11_api_exams.py' -v
      - name: T16 generated Worker schema across five areas and stderr sanitization
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt pytest==8.4.2
          python3 -m pytest -q pilot/orchestrator/test_t16_worker_schema.py pilot/orchestrator/test_t16_worker_errors.py pilot/orchestrator/test_t16_worker_e2e.py pilot/worker_v08/test_worker_context_safety.py pilot/worker_v08/test_t33_business_context.py pilot/orchestrator/test_t33_2_t7_rerun.py pilot/orchestrator/test_t33_3_contract_page.py pilot/orchestrator/test_t36_contract_ref.py pilot/worker_v08/test_t37_route_tool_defect.py pilot/orchestrator/test_t37_route_tool_proof.py pilot/worker_v08/test_t38_patch_intake.py pilot/worker_v08/test_t38_1_push_notice.py pilot/orchestrator/test_t39_exam_worker_order.py pilot/worker_v08/test_t39_1_history_forgiveness_scope.py pilot/worker_v08/test_t40_exam_controls.py pilot/test_t40_train_rehearsal.py pilot/orchestrator/test_t41_registry_lineage.py pilot/test_t42_owner_label_dispatch.py pilot/orchestrator/test_t43_lot_completion_actual.py pilot/orchestrator/test_t45_generated_index_conflict.py pilot/orchestrator/test_t46_conflict_replay.py pilot/orchestrator/test_t46_1_bounded_replay.py pilot/orchestrator/test_t46_2_history_pagination.py pilot/orchestrator/test_t47_template_fingerprint.py pilot/orchestrator/test_t48_exam_request_idempotence.py pilot/orchestrator/test_t49_lifecycle.py pilot/worker_v08/test_t49_1_worker.py pilot/worker_v08/test_t49_1_worker_token_isolation.py pilot/orchestrator/test_t49_1_cp35.py pilot/orchestrator/test_t49_1_pg37.py pilot/audit/test_t49_1_audit.py pilot/audit/test_t46_audit_stage.py pilot/audit/test_a4_report_scaffold.py pilot/audit/test_a5_auditor_job.py pilot/orchestrator/test_t50_history.py pilot/orchestrator/test_t50_pg37.py pilot/test_t51_watchdog.py pilot/test_t52_main_ci.py pilot/test_t52_watchdog_measure.py pilot/test_t57_maven_mirror.py pilot/ekb/test_t56_route_ekb.py pilot/ekb/test_t56_phase2.py pilot/orchestrator/test_api_budget.py -p no:cacheprovider
      - name: T17 standards contract for five generated branch types and CI recovery (offline)
        run: |
          python3 -m pytest -q pilot/orchestrator/test_t17_generated_standards.py pilot/orchestrator/test_t17_recovery_watchdog.py pilot/orchestrator/test_t17_4_conflict_recovery.py pilot/test_t17_1_ci_selection.py pilot/worker_v08/test_t32_examiner_defect.py pilot/orchestrator/test_t31_publish_exam.py pilot/orchestrator/test_t58_auto_examiner.py pilot/metrics/test_request_timeline.py -p no:cacheprovider
      - name: T17.2 Policy C notification coverage for every accepted bot branch (offline)
        run: |
          python3 -m pytest -q pilot/test_policy_c_handoff.py -p no:cacheprovider
          python3 -m pilot.workflow_entrypoint pilot/test_policy_c_handoff.py
      - name: T20 runner labels pinned across all 26 workflows (offline)
        run: python3 -m pilot.workflow_entrypoint pilot/test_t20_runner_pin.py
      - name: T25.1 GitHub typed paginated list and complete CP3.6 sweep isolation (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t25_1_github_lists_isolation.py -p no:cacheprovider
      - name: T25 guard T2 product exclusions and integration mechanical CI recovery (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t25_contract_derivatives.py -k "not real_npm_gen_api" -p no:cacheprovider
      - name: R1 cancelled pending run recovery and synthetic concurrency (offline)
        run: |
          python3 -m unittest discover -s pilot -p 'test_t9_2_stages.py' -v
          python3 -m pytest -q pilot/orchestrator/test_r1_pending_recovery.py -p no:cacheprovider
          python3 -m pytest -q pilot/orchestrator/test_r1_orphan_task_isolation.py -p no:cacheprovider
          python3 -m pytest -q pilot/orchestrator/test_r1_event_wake.py -p no:cacheprovider
          python3 -m pytest -q pilot/orchestrator/test_r1_pg37_intake.py -p no:cacheprovider
          python3 -m pytest -q pilot/orchestrator/test_r1_t7_reconcile.py -p no:cacheprovider
      - name: T24.1 full CP3.6 replay, SHA-pinned route defect history and recovery wiring (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t24_1_sweep_and_attempts.py -p no:cacheprovider
      - name: T24 area write scope contract vs CP3.5 and immutable PASS replay (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t24_scope_contract.py pilot/orchestrator/test_t24_integration_replay.py -p no:cacheprovider
      - name: T23.1 native registration subfamilies and nonblocking Train sweep (offline)
        run: python3 -m pytest -q pilot/test_t23_1_registration_handoff.py -p no:cacheprovider
      - name: T23 all-area Python pins, route defect accounting and verified automatic replay (offline + isolated runtime)
        run: |
          python3 -m pytest -q pilot/orchestrator/test_t23_route_runtime.py pilot/orchestrator/test_t23_route_recovery.py pilot/worker_v08/test_t23_route_attempt_history.py -p no:cacheprovider
      - name: T22 public feedback idempotency and hidden-field rejection (offline)
        run: python3 -m pytest -q pilot/worker_v08/test_t22_feedback_delivery.py pilot/worker_v08/test_t35_feedback_unlabeled_issue.py -p no:cacheprovider
      - name: T21 real pinned Python venv isolation regression (symlink fails, wrapper passes)
        run: python3 -m pilot.workflow_entrypoint pilot/test_t21_python_runtime.py
      - name: T21 native pre-admission recovery and historical proposal guard (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t21_native_infra_retry.py pilot/worker_v08/test_t21_native_history.py -p no:cacheprovider
      - name: T20 bot PR CI one retry per HEAD and watchdog (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t20_bot_ci_retry.py -p no:cacheprovider
      - name: T19 native envelope publication, push guard and worker client (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t19_native_submission.py -p no:cacheprovider
      - name: T26.1 contract lot attestation accepts trusted generator outputs (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t26_1_attest_derivatives.py -p no:cacheprovider
      - name: T26 affected project tests in lot scope and pending plan refresh (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t26_affected_tests.py -p no:cacheprovider
      - name: T18.1 isolated CP3.6 sweep and global failure alert (offline)
        run: python3 -m pytest -q pilot/orchestrator/test_t18_1_sweep_isolation.py -p no:cacheprovider
      - name: T18 native task package published and deterministic legacy repair (offline)
        run: |
          python3 -m pytest -q pilot/orchestrator/test_t18_task_pack_publication.py -p no:cacheprovider
          python3 -m unittest discover -s pilot/orchestrator -p 'test_intervention_report.py' -v
      - name: T13 generated acceptance Python dependency coverage (all areas)
        run: |
          python3 -m pilot.orchestrator.worker_python_dependencies
          python3 -m pytest -q pilot/orchestrator/test_worker_python_dependencies.py -p no:cacheprovider
      - name: T10 deterministic analysis report and same-area reuse regression
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt pytest==8.4.2
          python3 -m pytest -q pilot/orchestrator/test_t10_reuse_report.py -p no:cacheprovider
          python3 -m unittest discover -s pilot -p 'test_t10_comment.py' -v
      - name: T9.5 exact-main CI handoff, prerequisite and stage correlation
        run: |
          python3 -m pilot.test_workflow_base_ci
          python3 -m unittest discover -s pilot -p 'test_t9_5_main_ci.py' -v
      - name: Policy C offline auto-integrate admission tests (no token)
        run: |
          python3 -m py_compile pilot/auto_integrate.py
          python3 -m unittest discover -s pilot -p 'test_auto_integrate.py' -v
          python3 -m unittest discover -s pilot -p 'test_r4_policy_c_train_redispatch.py' -v
      - name: T9 issue request intake and provenance tests (offline)
        run: |
          python3 -m unittest discover -s pilot/orchestrator -p 'test_issue_intake.py' -v
          python3 -m unittest discover -s pilot/orchestrator -p 'test_request_finalize.py' -v
      - name: Sandbox Train policy and local Git conflict tests (offline, no token)
        run: |
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_policy.py' -v
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_merge.py' -v
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_retry.py' -v
          python3 -m unittest discover -s pilot/orchestrator -p 'test_intervention_report.py' -v
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_recovery.py' -v
          python3 -m pytest -q pilot/test_t52_bot_ci.py -p no:cacheprovider
      - name: T54 phase 1 project configuration safety tests
        run: python3 -m unittest discover -s pilot -p 'test_t54_project_config.py' -v
      - name: T54 phase 2 storage equivalence and safety tests
        run: python3 -m unittest discover -s pilot -p 'test_t54_storage_equivalence.py' -v
      - name: T54 phase 3a component map and area roots
        run: python3 -m unittest discover -s pilot -p 'test_t54_phase3a.py' -v
      - name: T54 phase 3b lot planning and admission from project config
        run: python3 -m unittest discover -s pilot -p 'test_t54_phase3b.py' -v
      - name: T54 phase 3c Worker-side consumers from project config
        run: python3 -m unittest discover -s pilot -p 'test_t54_phase3c.py' -v
      - run: python3 standards/tools/changes.py render --check
      - run: python3 standards/tools/changes.py validate
      - name: "Circuito C9: clasificación y versiones (solo PR)"
        if: github.event_name == 'pull_request'
        run: python3 standards/tools/changes.py check --base "origin/${{ github.base_ref }}"
