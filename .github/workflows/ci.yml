  t7-generated-content:
    name: T7 generated content byte equality
    if: >-
      startsWith(github.head_ref || github.ref_name, 'lf/generated-t7/') ||
      startsWith(github.head_ref || github.ref_name, 'lf/implemented-registry/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      PROPOSAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted main only, not the candidate PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Pin historical and A1-A9 offline verifier dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt
      - name: Independently reproduce generated bytes from main and verify candidate
        run: python3 -m pilot.workflow_entrypoint pilot/t7_generated_ci.py --branch "$BRANCH" --sha "$PROPOSAL_SHA"

  t7-registry-history:
    name: T7 registry reconstructed from exact historical Train merges
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build read-only historical registry candidate (never modify main)
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt
          python3 -m py_compile pilot/orchestrator/implemented_registry.py
          python3 -m pilot.workflow_entrypoint pilot/orchestrator/implemented_registry.py --main-sha "$(git rev-parse origin/main)" --write
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("pilot/registry/implemented.json")
          value=json.loads(p.read_text())
          assert value["schema_version"]=="T7_IMPLEMENTED_REGISTRY_V1"
          assert value["entries"]
          assert all(e["merge_sha"] and e["status"] in ("ATTESTED","NO_DERIVABLE") for e in value["entries"])
          print("T7_REGISTRY_HISTORY_RECONSTRUCTED",len(value["entries"]))
          PY
      - name: Verify rule-complete existing implementation against live main hashes
        env:
          # T41: a pending verified integration may EXTEND a registered file.
          LF_PENDING_INTEGRATION_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          from pilot.orchestrator.reuse_assessment import assess,index
          root=pathlib.Path(".")
          registry=json.loads((root/"pilot/registry/implemented.json").read_text())
          available={rule for row in registry["entries"] for rule in row["rule_codes"]}
          candidates=[]
          for file in sorted((root/"pilot/runs").glob("*/analysis.json")):
              package=json.loads(file.read_text())
              refs={r.get("source_requirement_id") for r in package.get("requirements",[])
                    if isinstance(r,dict)}
              if refs and refs.issubset(available):
                  candidates.append(package)
          assert candidates, "T7_HISTORICAL_RULE_BINDING_NOT_FOUND"
          for package in candidates:
              report=assess(index(root),package["requirements"],registry=registry,root=root)
              assert all(row["decision"]=="REUSE_AS_IS" for row in report["obligations"])
          print("T7_HISTORICAL_REUSE_AS_IS_PROVEN",len(candidates))
          PY

  t5-browser-visible:
    name: T5 Playwright Chromium local app (visible only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/pilot
      DB_USERNAME: pilot
      DB_PASSWORD: pilot
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilot
          POSTGRES_DB: pilot
          POSTGRES_PASSWORD: pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"
      - name: Maven Central mirror with Central fallback (T57)
        shell: bash
        run: |
          set -euo pipefail
          # Global settings apply to every mvn on this runner, including the
          # vendored Worker and exams that run with an isolated, empty HOME.
          maven_home="$(mvn -v | sed -n 's/^Maven home: //p')"
          test -n "$maven_home" && test -d "$maven_home/conf"
          sudo tee "$maven_home/conf/settings.xml" >/dev/null <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>lf-maven-mirror</id>
                <repositories>
                  <repository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>lf-maven-mirror</activeProfile>
            </activeProfiles>
          </settings>
          XML
          grep -q "maven-central.storage-download.googleapis.com" "$maven_home/conf/settings.xml"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned browser once, only within trusted CI
        run: |
          python3 -m venv /tmp/lf-python-runtime
          /tmp/lf-python-runtime/bin/python -m pip install --disable-pip-version-check --no-input -r pilot/worker_v08/python_runtime_requirements.txt
          PLAYWRIGHT_BROWSERS_PATH=/tmp/lf-playwright-browsers \
            /tmp/lf-python-runtime/bin/python -m playwright install --with-deps --only-shell chromium
      - name: Prepare real app (no oracle and no model)
        run: |
          npm --prefix frontend ci
          mvn -B -q -f apps/time-service/pom.xml -DskipTests package
      - name: Run actual local Chromium against backend plus frontend
        run: |
          python3 -m pilot.workflow_entrypoint pilot/worker_v08/playwright_gate.py --path / --selector main
      - name: Run declarative frontend visible suite against the real app
        run: |
          python3 -m pilot.workflow_entrypoint pilot/worker_v08/playwright_gate.py --suite frontend/visible-tests --mutation-check

  standards-shadow:
    # D11: modo sombra. Cada paso reporta violaciones pero no bloquea el PR.
