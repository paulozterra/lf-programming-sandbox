name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify

  frontend:
    name: frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Sin package-lock.json: se genera con npm install."
            npm install --no-audit --no-fund
          fi
      # Paso temporal de arranque: la sesión que armó el repo no alcanza el registro de npm,
      # así que el CI genera el lockfile y lo sube a la rama del PR. Se retira en el commit siguiente.
      - name: Subir package-lock.json generado a la rama del PR (arranque)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git -C .. ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          git add package-lock.json
          git commit -m "chore(frontend): agregar package-lock.json generado por CI"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  infra-local:
    name: infra local (docker compose)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/compose.yaml config --quiet
      - run: docker compose -f docker/compose.yaml up -d --wait --wait-timeout 180
      - name: Floci acepta conexiones
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4566/ || true)
            if [ "$code" != "000" ]; then echo "Floci respondió HTTP $code"; exit 0; fi
            sleep 2
          done
          docker compose -f docker/compose.yaml logs floci; exit 1
      - if: always()
        run: docker compose -f docker/compose.yaml down -v
