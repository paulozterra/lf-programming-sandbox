name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Maven verify)
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/lf_ci
      DB_USERNAME: pilot
      DB_PASSWORD: pilot
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot
          POSTGRES_DB: lf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d lf_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: STD-BE-05 Spotless/Palantir (required for time-service)
        working-directory: .
        run: mvn -U -B -q -f apps/time-service/pom.xml spotless:check
      - run: python3 ../standards/tools/stack_checks.py run --set spring-boot --check-id spring-verify
      - name: Compile and run staged reminders visible tests (no model)
        working-directory: .
        run: mvn -U -B -q -f apps/time-service/pom.xml test
      - name: "T2: verify live springdoc operations against every contract"
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2 openapi-spec-validator==0.7.2
          mvn -U -B -q -f apps/time-service/pom.xml spring-boot:start
          python3 pilot/orchestrator/contract_validate.py --compare-live http://127.0.0.1:8080/v3/api-docs
          if grep -q '<artifactId>spring-boot-starter-flyway</artifactId>' apps/time-service/pom.xml; then
            PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -U "$DB_USERNAME" -d lf_ci \
              -X -v ON_ERROR_STOP=1 -tAc "SELECT count(*) >= 0 FROM flyway_schema_history"
          fi
      - name: "T2: stop springdoc verification backend"
        if: always()
        working-directory: .
        run: mvn -B -q -f apps/time-service/pom.xml spring-boot:stop || true

  frontend:
    name: frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git diff --exit-code -- frontend/src/lib/api/generated
        working-directory: .
      - name: "T2: block stale types and manual API fetch"
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2 openapi-spec-validator==0.7.2
          python3 pilot/orchestrator/contract_validate.py --check-client .
          python3 pilot/orchestrator/contract_validate.py --check-frontend .
      - run: python3 ../standards/tools/stack_checks.py run --set nextjs --check-id next-lint
      - run: python3 ../standards/tools/stack_checks.py run --set nextjs --check-id next-typecheck
      - run: python3 ../standards/tools/stack_checks.py run --set nextjs --check-id next-build

  standards-catalog:
    name: estándares (catálogo y checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 standards/tools/stack_checks.py validate --ci .github/workflows/ci.yml
      - run: python3 standards/tools/skills.py validate
      - name: "C6: ensamblado sintético Spring offline"
        run: |
          python3 -c 'import hashlib,json,pathlib; p=pathlib.Path("standards/catalog.json"); d=json.loads(p.read_text()); print(json.dumps({"catalog_version":d["catalog_version"],"catalog_sha256":hashlib.sha256(p.read_bytes()).hexdigest()}))' > /tmp/skill-pin.json
          python3 standards/tools/skills.py assemble --pin /tmp/skill-pin.json --skills spring-boot --domains STD-BE,STD-API,STD-SEC,STD-GEN,STD-LOG,STD-MSG,STD-AUD,STD-GIT --out /tmp/c6-spring.txt
          python3 standards/tools/skills.py assemble --pin /tmp/skill-pin.json --skills spring-boot --domains STD-BE,STD-API,STD-SEC,STD-GEN,STD-LOG,STD-MSG,STD-AUD,STD-GIT,STD-NAV,STD-CONS --out /tmp/c6-spring-all.txt
      - run: python3 standards/tools/consumption.py validate
      - run: python3 standards/tools/consumption.py render --check
      - name: Reject runner context in job env across all workflows
        run: python3 pilot/check_workflow_job_env.py
      - name: Parse every GitHub Actions YAML and require jobs (offline, blocking)
        run: |
          python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          python3 pilot/test_workflow_yaml_policy.py
      - name: Policy C offline auto-integrate admission tests (no token)
        run: |
          python3 -m py_compile pilot/auto_integrate.py
          python3 -m unittest discover -s pilot -p 'test_auto_integrate.py' -v
      - name: Sandbox Train policy and local Git conflict tests (offline, no token)
        run: |
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_policy.py' -v
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_merge.py' -v
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_retry.py' -v
          python3 -m unittest discover -s pilot/orchestrator -p 'test_intervention_report.py' -v
          python3 -m unittest discover -s pilot -p 'test_sandbox_train_recovery.py' -v
      - run: python3 standards/tools/changes.py validate
      - name: "Circuito C9: clasificación y versiones (solo PR)"
        if: github.event_name == 'pull_request'
        run: python3 standards/tools/changes.py check --base "origin/${{ github.base_ref }}"
      - name: "Circuito C9: baseline D11 (solo PR)"
        if: github.event_name == 'pull_request'
        run: python3 standards/tools/changes.py baseline-check --base "origin/${{ github.base_ref }}"
      - run: python3 standards/tools/validate_catalog.py
      - run: python3 standards/tools/render_llm.py --check
      - run: python3 standards/tools/glossary.py validate
      - run: python3 standards/tools/glossary.py render --check
      - run: python3 standards/tools/waivers.py validate
      - run: python3 standards/tools/waivers.py render --check
      - run: python3 standards/tools/kit.py verify
      - run: python3 standards/tools/stack_checks.py run --set postgres-flyway --check-id db-catalog-files
      - run: python3 -m unittest discover -s standards/tests -v

  standards-shadow:
    # D11: modo sombra. Cada paso reporta violaciones pero no bloquea el PR.
    name: estándares (modo sombra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: STD-BE-05 formato Java (Spotless + palantir)
        run: python3 standards/tools/stack_checks.py run --set spring-boot --check-id spring-spotless
      - name: STD-FE-07 formato frontend (Prettier)
        working-directory: frontend
        run: python3 ../standards/tools/stack_checks.py run --set nextjs --check-id next-prettier
      - name: STD-FE-02 nombres de archivo en kebab-case
        run: python3 standards/tools/checks.py filenames frontend/src | sed 's/^STD-/::warning title=STD-FE-02 (sombra)::STD-/' || true
      - name: STD-GEN-05 supresiones con waiver
        run: python3 standards/tools/waivers.py check-refs backend/src frontend/src | sed 's/^STD-/::warning title=STD-GEN-05 (sombra)::STD-/' || true
      - name: STD-GEN-01 glosario en las líneas nuevas
        if: github.event_name == 'pull_request'
        run: python3 standards/tools/glossary.py check-diff --base "origin/${{ github.base_ref }}" | sed 's/^STD-/::warning title=STD-GEN-01 (sombra)::STD-/' || true
      - name: STD-GIT-01 nombre de rama
        if: github.event_name == 'pull_request'
        run: python3 standards/tools/checks.py branch "${{ github.head_ref }}" | sed 's/^STD-/::warning title=STD-GIT-01 (sombra)::STD-/' || true

  infra-local:
    name: infra local (docker compose)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only
      KIT_PSQL_MODE: docker
    steps:
      - uses: actions/checkout@v5
      - run: python3 standards/tools/stack_checks.py run --set postgres-flyway
      - run: docker compose -f docker/compose.yaml up -d --wait --wait-timeout 180
      - name: Kit C5 render reproducible
        run: python3 standards/tools/kit.py render --schema kit_test --trace-prefix KIT --out /tmp/kit-render
      - name: Kit C5 migraciones y reversas
        run: python3 standards/tools/db_catalog_lint.py migrate-test
      - name: Kit C5 revisión PostgreSQL (bloqueante solo kit)
        run: python3 standards/tools/db_catalog_lint.py lint --schema kit_test --format json
      - name: Kit C5 negativos por regla
        run: python3 standards/tools/db_catalog_lint.py test-negative
      - name: Kit C5 conducta y roles
        run: python3 standards/tools/db_catalog_lint.py test-behavior
      - name: "C11: DDL PostgreSQL 17 y pruebas negativas"
        run: |
          docker compose -f docker/compose.yaml exec -T postgres psql -X -v ON_ERROR_STOP=1 -U sandbox -d sandbox -c 'DROP SCHEMA IF EXISTS consumption_test CASCADE'
          sed 's/${schema}/consumption_test/g' standards/consumption/ddl/model_usage.sql | docker compose -f docker/compose.yaml exec -T postgres psql -X -v ON_ERROR_STOP=1 -U sandbox -d sandbox
          docker compose -f docker/compose.yaml exec -T postgres psql -X -v ON_ERROR_STOP=1 -U sandbox -d sandbox < standards/consumption/tests/behavior.sql
          docker compose -f docker/compose.yaml exec -T postgres psql -X -v ON_ERROR_STOP=1 -U sandbox -d sandbox < standards/consumption/tests/aggregates.sql
          docker compose -f docker/compose.yaml exec -T postgres psql -X -v ON_ERROR_STOP=1 -U sandbox -d sandbox < standards/consumption/tests/new_negatives.sql
          docker compose -f docker/compose.yaml exec -T postgres psql -X -v ON_ERROR_STOP=1 -U sandbox -d sandbox -c 'DROP SCHEMA consumption_test CASCADE'
      - name: Floci acepta conexiones
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4566/ || true)
            if [ "$code" != "000" ]; then echo "Floci respondió HTTP $code"; exit 0; fi
            sleep 2
          done
          docker compose -f docker/compose.yaml logs floci; exit 1
      - if: always()
        run: docker compose -f docker/compose.yaml down -v

  worker-pilot-offline:
    name: Worker pilot (offline budget, policy, vendor integrity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify budget cases (NO MODEL)
        run: python3 pilot/worker_v08/test_budget_gate.py
      - name: Verify manual-only workflow policy (NO MODEL)
        run: python3 pilot/worker_v08/test_workflow_policy.py
      - name: Verify vendored Worker SHA-256 (NO MODEL)
        run: python3 pilot/worker_v08/verify_vendor.py
      - name: Verify per-task specification and holdout registration (NO MODEL)
        run: python3 pilot/worker_v08/test_task_selector.py
      - name: Verify LF fixed-source SHA-256 and API/native context registration (offline, no model)
        run: python3 pilot/worker_v08/test_register_task_context.py
      - name: Offline ex4 lot size, PR handoff and oracle SHA checks (pytest; NO MODEL)
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python3 -m pytest -q pilot/worker_v08/test_lot_preflight.py
          python3 -m pytest -q pilot/worker_v08/test_native_clients.py
          python3 -m pytest -q pilot/worker_v08/test_native_run.py
          python3 -m pytest -q pilot/worker_v08/test_holdout_age.py

      - name: CP3.4 profile mapping, real paths and two-lot simulated handoff (NO MODEL)
        run: |
          python3 -m py_compile pilot/orchestrator/native_lot_binding.py pilot/orchestrator/native_lot_registration.py
          python3 -m pytest -q pilot/orchestrator/test_native_lot_binding.py pilot/orchestrator/test_native_lot_registration.py -p no:cacheprovider

      - name: CP3.5 native PASS artifact gates and one-command orchestration (NO MODEL)
        run: |
          python3 -m py_compile pilot/orchestrator/native_verified_integration.py pilot/orchestrator/prepare_native_lot.py
          python3 -m pytest -q pilot/orchestrator/test_native_verified_integration.py pilot/orchestrator/test_prepare_native_lot.py -p no:cacheprovider

      - name: CP3.6 verified Train merge DAG, three failures and 2-lot end-to-end simulation (NO MODEL)
        run: |
          python3 -m py_compile pilot/orchestrator/chain_contract.py pilot/orchestrator/chain_lots.py
          python3 -m pytest -q pilot/orchestrator/test_chain_lots.py -p no:cacheprovider

      - name: CP3.7 pinned PG06-PG14 source candidates and two-lot H_REPORT (NO MODEL)
        run: |
          python3 -m py_compile pilot/orchestrator/pg37_evidence.py pilot/orchestrator/pg37_publish.py
          python3 -m pytest -q pilot/orchestrator/test_pg37_evidence.py -p no:cacheprovider

      - name: Offline ex5c deterministic derivation adversarial tests (pytest; NO MODEL)
        run: python3 -m pytest -q pilot/worker_v08/test_derive_context.py

      - name: Exercise ex5c derive-context CLI and full-file checksum offline
        run: |
          python3 pilot/worker_v08/derive_context.py --task ex5c --root . --output "$RUNNER_TEMP/derived-context.json"
          cd "$RUNNER_TEMP" && sha256sum --check derived-context.sha256

      - name: Compile real-ex5c bundle generator and test SHA/mapping offline (NO API)
        run: |
          python3 -m py_compile evidence/ex5c/build_bundle.py evidence/ex5c/test_bundle_offline.py
          python3 -m unittest discover -s evidence/ex5c -p 'test_bundle_offline.py' -v

      - name: Validate pinned ex5c v2 evidence generator without model or network
        run: |
          python3 -m py_compile evidence/ex5c/build_bundle_v2.py evidence/ex5c/test_bundle_v2_offline.py
          python3 -m unittest discover -s evidence/ex5c -p 'test_bundle_v2_offline.py' -v

      - name: EX6 secretless two-snapshot build and AOSP evidence contract offline
        run: |
          python3 -m py_compile evidence/ex6/build_bundle_v1.py evidence/ex6/verify_bundle_v1.py evidence/ex6/test_bundle_v1_offline.py
          python3 -m unittest discover -s evidence/ex6 -p 'test_bundle_v1_offline.py' -v

      - name: Offline AOSP N+1 source and class-byte CI invariants
        run: |
          python3 -m py_compile evidence/ex5c/format_remediation.py evidence/ex5c/verify_format_remediation.py evidence/ex5c/test_format_remediation_offline.py evidence/ex5c/build_bundle_v3.py evidence/ex5c/test_bundle_v3_offline.py
          python3 -m unittest discover -s evidence/ex5c -p 'test_format_remediation_offline.py' -v
          python3 -m unittest discover -s evidence/ex5c -p 'test_bundle_v3_offline.py' -v

      - name: Verify offline task preflight routing (NO REAL ORACLE, NO MODEL)
        run: python3 pilot/worker_v08/test_preflight_routing.py
      - name: Original Worker fake MODEL_ERROR produces sanitized receipts (NO API)
        run: python3 pilot/worker_v08/test_model_error_artifacts.py
      - name: Anthropic diagnostic request and disclosure offline (NO API)
        run: python3 pilot/worker_v08/test_anthropic_diagnostic.py
      - name: Sonnet structured ModelClient strict fake transport (NO API)
        run: python3 pilot/worker_v08/test_anthropic_structured_client.py

  native-autolaunch-policy:
    name: native push policy (offline only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned offline test requirements
        run: python3 -m pip install "pytest==8.3.5" "cryptography==49.0.0"
      - name: Verify original vendored code is unchanged
        run: python3 pilot/worker_v08/verify_vendor.py
      - name: Run guarded push and attempt history negatives
        run: |
          python3 -m pytest -q pilot/worker_v08/test_native_run.py pilot/worker_v08/test_native_push_policy.py pilot/worker_v08/test_native_push_guard.py pilot/worker_v08/test_push_workflow_no_secrets.py pilot/worker_v08/test_native_workflow_run_name.py pilot/worker_v08/test_native_history_redirect.py
          python3 pilot/worker_v08/test_workflow_policy.py

  lf-producers-pinned:
    name: LF pinned producer integrity and offline suites (no Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact LF SHA for independent byte comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cristhianlujan/claude-persona-lf-patch
          ref: 882c7213f83887952a99ad0793174d535eb91233
          path: lf-source
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify SHA-256 and byte equality with pinned LF commit
        run: |
          python3 pilot/lf_producers_pinned/verify_source_pin.py \
            --root . --lf-source lf-source \
            --json-out "$RUNNER_TEMP/lf-source-pin-result.json"
      - name: Install pinned pytest
        run: python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2
      - name: Run copied LF producer suites offline, without LF credentials
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          LF_SYNTHETIC_ONLY: "1"
        run: |
          python3 pilot/lf_producers_pinned/run_suites.py \
            --out "$RUNNER_TEMP/lf-producer-suites.json"
      - name: Publish offline suite classification and pin result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lf-pinned-producer-checks
          path: |
            ${{ runner.temp }}/lf-source-pin-result.json
            ${{ runner.temp }}/lf-producer-suites.json
          if-no-files-found: ignore
          retention-days: 30

  cp3-2-intake:
    name: CP3.2 intake simulated A9 and PG-01 fixture (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install offline pytest
        run: python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2
      - name: Validate simulated request, rejects, deterministic state and no authority
        run: |
          python3 -m pytest -q pilot/orchestrator/test_intake.py
      - name: Exercise CLI without persisting generated state in checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cp3-2/pilot/runs/sample-reminder-note"
          cp pilot/runs/sample-reminder-note/request.md pilot/runs/sample-reminder-note/analysis.json "$RUNNER_TEMP/cp3-2/pilot/runs/sample-reminder-note/"
          python3 pilot/orchestrator/intake.py --root "$RUNNER_TEMP/cp3-2" --request-id sample-reminder-note
          test -f "$RUNNER_TEMP/cp3-2/pilot/runs/sample-reminder-note/state.json"
  
  cp3-3-planning:
    name: CP3.3 pinned PG02-PG05 and real disposable SQL selector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SELECTOR_EXP_DISPOSABLE_DB: "YES"
      SELECTOR_EXP_TEST_DSN: postgresql://pilot:pilot@127.0.0.1:5432/selector_exp_test_cp33
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Start disposable PostgreSQL 17 bound to runner loopback
        shell: bash
        run: |
          set -euo pipefail
          # The pinned LF selector guard verifies inet_server_addr() is loopback.
          # GH services use a bridge address (172.x), so a host-network DB with
          # listen_addresses=127.0.0.1 is required; never relax the guard.
          docker run --detach --rm --name cp33-disposable-db --network host \
            -e POSTGRES_USER=pilot -e POSTGRES_PASSWORD=pilot \
            -e POSTGRES_DB=selector_exp_test_cp33 \
            -e POSTGRES_INITDB_ARGS=--locale=C \
            postgres:17 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 40); do
            if pg_isready -h 127.0.0.1 -p 5432 -U pilot -d selector_exp_test_cp33 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U pilot -d selector_exp_test_cp33
      - name: Load ORIGINAL pinned SQL into fresh local-only database
        run: python3 pilot/orchestrator/selector_db.py
      - name: Run CP3.3 offline integration tests and adversarial gates
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python3 -m pytest -q pilot/orchestrator/test_plan_lots.py
          python3 -m pytest -q pilot/orchestrator/test_intake.py
      - name: P4 priority intake and real PG02-PG05 selector outputs equal committed JSON
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=pilot psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U pilot -d selector_exp_test_cp33 -c "INSERT INTO public.lf_project_area_pattern_exp(project_ref,area,path_prefix) VALUES ('lf_java','BACKEND','apps/time-service/src/main/java/')"
          mkdir -p "$RUNNER_TEMP/p4/pilot/runs/p4-prioridad"
          cp pilot/runs/p4-prioridad/request.md pilot/runs/p4-prioridad/analysis.json pilot/runs/p4-prioridad/planning_fixture.json "$RUNNER_TEMP/p4/pilot/runs/p4-prioridad/"
          python3 pilot/orchestrator/intake.py --root "$RUNNER_TEMP/p4" --request-id p4-prioridad
          python3 pilot/orchestrator/plan_lots.py --root "$RUNNER_TEMP/p4" --request-id p4-prioridad
          cmp "$RUNNER_TEMP/p4/pilot/runs/p4-prioridad/lots.json" pilot/runs/p4-prioridad/lots.json
          cmp "$RUNNER_TEMP/p4/pilot/runs/p4-prioridad/state.json" pilot/runs/p4-prioridad/state.json
          python3 - <<'PY'
          import json,pathlib
          from pilot.orchestrator.native_lot_binding import real_write_paths
          root=pathlib.Path('.')
          lots=json.loads((root/'pilot/runs/p4-prioridad/lots.json').read_text())
          state=json.loads((root/'pilot/runs/p4-prioridad/state.json').read_text())
          assert [x['area'] for x in lots['lots']]==['DATA','BACKEND']
          assert [x['profile_code'] for x in lots['lots']]==['PERFIL-PROG-DATA-EXP','PERFIL-PROG-BACKEND-SPRING-EXP']
          assert len(lots['lots'])==2 and lots['topological_order']==[x['id'] for x in lots['lots']]
          assert lots['lots'][0]['depends_on']==[] and lots['lots'][1]['depends_on']==[lots['lots'][0]['id']]
          assert [len(x['write_paths']) for x in lots['lots']]==[1,4]
          assert state['stage']=='LOTS_PLANNED' and state['lot_count']==2 and not lots['worker_invoked']
          for lot in lots['lots']:
              assert real_write_paths(root,lot['area'],lot['write_paths'])==sorted(lot['write_paths'])
          print('P4_PINNED_TWO_LOTS_AND_REAL_PATHS_PASS')
          PY
      - name: Produce three-area and note fixture JSON to private runner staging
        shell: bash
        run: |
          set -euo pipefail
          for name in sample-three-area-notes sample-reminder-note; do
            mkdir -p "$RUNNER_TEMP/cp33/pilot/runs/$name"
            cp "pilot/runs/$name/request.md" "pilot/runs/$name/analysis.json" "pilot/runs/$name/planning_fixture.json" "$RUNNER_TEMP/cp33/pilot/runs/$name/"
            python3 pilot/orchestrator/intake.py --root "$RUNNER_TEMP/cp33" --request-id "$name"
            python3 pilot/orchestrator/plan_lots.py --root "$RUNNER_TEMP/cp33" --request-id "$name"
          done
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"cp33/pilot/runs/sample-three-area-notes"
          x=json.loads((root/"lots.json").read_text())
          print("CP33_THREE_AREA_LOTS_JSON_START")
          print(json.dumps(x,sort_keys=True,separators=(",",":"),ensure_ascii=True))
          print("CP33_THREE_AREA_LOTS_JSON_END")
          PY
      - name: T1 fixture-free A9 atoms, PG02-PG05 and chain on disposable selector
        env:
          ATOMIZE_T1_SELECTOR: "YES"
          T2_ARTIFACT_DIR: ${{ runner.temp }}/t2
          T1_ARTIFACT_DIR: ${{ runner.temp }}/t1
        run: |
          python3 pilot/orchestrator/selector_db.py --t1-patterns
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2 openapi-spec-validator==0.7.2 jsonschema==4.25.1
          python3 -m pytest -q pilot/orchestrator/test_atomize.py pilot/orchestrator/test_atomize_modules.py pilot/orchestrator/test_contract_t2.py pilot/orchestrator/test_t2_general_guard.py pilot/orchestrator/test_t3_infra.py -p no:cacheprovider
      - name: A9 regression suites; T2 three-case test supersedes old two-area T1-A check
        env:
          T1A_ARTIFACT_DIR: ${{ runner.temp }}/t1a
        run: |
          python3 -m pip install jsonschema
          # The historical T1-A test asserts exactly two areas; T2 now
          # requires a third CONTRATO area. Its replacement is the three-case
          # test_contract_t2.py executed above against the real A9 Login package.
          python3 -m pytest -q analysis/programming_analysis/steps/a1 analysis/programming_analysis/steps/a2 analysis/programming_analysis/steps/a3 analysis/programming_analysis/steps/a4 analysis/programming_analysis/steps/a5 analysis/programming_analysis/adapters analysis/programming_analysis/evals analysis/test_known_inherited_failures.py analysis/host analysis/a6 analysis/a7 analysis/a8 analysis/a9 -p no:cacheprovider --deselect=analysis/host/test_t1a_login_gate.py::test_login_two_source_areas_without_owner_or_fixture
      - name: "T2: publish 3-case contract lots and drafts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-contract-lots
          path: ${{ runner.temp }}/t2/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish T1-A generated Login lots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t1a-login-lots
          path: ${{ runner.temp }}/t1a/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish T1 exact generated lots and Login unresolved evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t1-atomized-lots
          path: ${{ runner.temp }}/t1/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish exact generated lots and deterministic state from disposable DB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp33-disposable-selector-lots
          path: ${{ runner.temp }}/cp33/pilot/runs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop disposable database
        if: always()
        run: docker stop cp33-disposable-db || true
