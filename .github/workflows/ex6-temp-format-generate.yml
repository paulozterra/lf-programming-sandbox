name: EX6 temporary generate exact AOSP N1 formatted files
on:
  push:
    branches: [lf/ex6-aosp-format-n1-20261109]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"
      - name: Produce exact formatted Java and prove every class byte identical
        run: |
          set -euo pipefail
          python3 evidence/ex6/format_remediation_n1.py --root . --out "$RUNNER_TEMP/ex6-n1-output"
          cd "$RUNNER_TEMP/ex6-n1-output"
          sha256sum --check ex6-n1-class-equivalence.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex6-aosp-n1-java-and-class-receipt
          path: ${{ runner.temp }}/ex6-n1-output/
          if-no-files-found: error
