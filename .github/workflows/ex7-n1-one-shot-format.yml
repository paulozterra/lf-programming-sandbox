name: EX7 N+1 one-shot Palantir formatter and byte-equivalence
on:
  pull_request:
    branches:
      - lf/ex7-palantir-n1-chg0032
permissions:
  contents: write
jobs:
  render-derived-cambios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lf/ex7-palantir-n1-chg0032
          fetch-depth: 0
          persist-credentials: true
      - name: Generate C9 registry using official renderer (no manual edits)
        run: |
          set -euo pipefail
          git fetch origin lf/ex7-palantir-n1-chg0032
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/lf/ex7-palantir-n1-chg0032)"
          python3 standards/tools/changes.py render
          python3 standards/tools/changes.py render --check
          git diff --name-only | grep -Fxq standards/CAMBIOS.md
          test "$(git diff --name-only | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standards/CAMBIOS.md
          git diff --cached --check
          git commit -m "CHG-0032: regenerate CAMBIOS.md with official changes.py renderer"
          git push origin HEAD:lf/ex7-palantir-n1-chg0032
