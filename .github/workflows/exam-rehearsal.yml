name: LF exam rehearsal (reference through the real Worker, T40)
# Capa 1: every PR that registers a lot or changes an exam must show that the
# examiner's reference passes visible + hidden acceptance with the original
# Worker on the registered base. Code from trusted main; PR files are data.
# The ENVIRONMENT block below is copied verbatim from worker-native.yml and
# test_t40_exam_controls.py fails if they drift.

on:
  pull_request:
    paths:
      - "pilot/worker_v08/native_tasks/**"
      - "pilot/holdouts/**"
  workflow_dispatch:
    inputs:
      task:
        description: "Registered task to rehearse (empty: lots/exams changed by this branch vs main)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lf-exam-rehearsal-${{ github.event.pull_request.number || inputs.task }}
  cancel-in-progress: true

jobs:
  rehearse:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilot
          POSTGRES_DB: pilot
          POSTGRES_PASSWORD: pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Credentials exist only for this job's disposable PostgreSQL service.
      # Worker command subprocesses receive these through the trusted DB bridge.
      DB_URL: jdbc:postgresql://127.0.0.1:5432/pilot
      DB_USERNAME: pilot
      DB_PASSWORD: pilot
    steps:
      - name: Checkout trusted main control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout PR or main as data only (no execution)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: data
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap guard (rehearsal tool must already be on trusted main)
        id: boot
        run: |
          if [ -f control/pilot/worker_v08/exam_rehearsal.py ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "EXAM_REHEARSAL_NOT_ON_MAIN_YET"; echo "ready=false" >> "$GITHUB_OUTPUT"; fi
# >>> ENVIRONMENT (verbatim from worker-native.yml)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned shared Python acceptance runtime (T13)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/lf-python-runtime
          /tmp/lf-python-runtime/bin/python -m pip install --disable-pip-version-check --no-input -r control/pilot/worker_v08/python_runtime_requirements.txt
          python3 control/pilot/worker_v08/install_lf_python.py --output /tmp/lf-python-wrapper
          sudo install -m 755 /tmp/lf-python-wrapper /usr/local/bin/lf-python
          isolated_path="/usr/local/bin:/usr/bin:/bin"
          test "$(env -i PATH="$isolated_path" /bin/sh -c 'command -v lf-python')" = /usr/local/bin/lf-python
          env -i PATH="$isolated_path" lf-python -c 'import yaml, jsonschema, openapi_spec_validator, playwright.sync_api'
          echo T13_ISOLATED_PYTHON_RUNTIME_PASS
      - name: Set up Java 21 for EX6 (SHA pinned)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # pinned commit, Temurin
        with:
          distribution: temurin
          java-version: "21"
      - name: Maven Central mirror with Central fallback (T57)
        shell: bash
        run: |
          set -euo pipefail
          # Global settings apply to every mvn on this runner, including the
          # vendored Worker and exams that run with an isolated, empty HOME.
          maven_home="$(mvn -v | sed -n 's/^Maven home: //p')"
          test -n "$maven_home" && test -d "$maven_home/conf"
          sudo tee "$maven_home/conf/settings.xml" >/dev/null <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>lf-maven-mirror</id>
                <repositories>
                  <repository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>lf-maven-mirror</activeProfile>
            </activeProfiles>
          </settings>
          XML
          grep -q "maven-central.storage-download.googleapis.com" "$maven_home/conf/settings.xml"

      - name: Link JDK 21 and Maven into the vendored Worker's fixed PATH (EX6)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME:-}" && test -x "$JAVA_HOME/bin/java"
          for tool in java javac jar; do
            test -x "$JAVA_HOME/bin/$tool"
            sudo ln -sfn "$JAVA_HOME/bin/$tool" "/usr/local/bin/$tool"
          done
          maven_source="$(command -v mvn)"
          test -n "$maven_source"
          maven_source="$(readlink -f "$maven_source")"
          test -x "$maven_source"
          sudo ln -sfn "$maven_source" /usr/local/bin/mvn

      - name: Verify isolated Worker command environment uses Java 21 and Maven (EX6)
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$(mktemp -d)"
          trap 'rm -rf "$isolated_home"' EXIT
          isolated_path="/usr/local/bin:/usr/bin:/bin"
          # Match worker_commands._command_environment: absolutely no JAVA_HOME.
          env -i PATH="$isolated_path" HOME="$isolated_home" /bin/bash -c '
            set -euo pipefail
            test -z "${JAVA_HOME:-}"
            test "$(command -v java)" = "/usr/local/bin/java"
            test "$(command -v javac)" = "/usr/local/bin/javac"
            test "$(command -v jar)" = "/usr/local/bin/jar"
            test "$(command -v mvn)" = "/usr/local/bin/mvn"
          '
          java_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" java -version 2>&1)"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.+_-]|")'
          maven_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" mvn -v 2>&1)"
          printf '%s\n' "$maven_version" | grep -Eq 'Apache Maven '
          printf '%s\n' "$maven_version" | grep -Eq 'Java version: 21([.+_-]|[, ]|$)'
          echo "EX6_ISOLATED_JAVA21_AND_MAVEN_PASS"
      - name: Set up Node 22 for isolated Worker
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Expose Node, npm and PostgreSQL client in Worker fixed PATH
        shell: bash
        run: |
          set -euo pipefail
          for binary in node npm psql pg_isready; do
            resolved="$(readlink -f "$(command -v "$binary")")"
            test -x "$resolved"
            sudo ln -sfn "$resolved" "/usr/local/bin/$binary"
          done
      - name: Smoke-test isolated Node, npm, Java and disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          isolated_path="/usr/local/bin:/usr/bin:/bin"
          for binary in node npm psql pg_isready; do
            test "$(/usr/bin/env -i PATH="$isolated_path" /bin/sh -c "command -v $binary")" = "/usr/local/bin/$binary"
          done
          env -i PATH="$isolated_path" node --version | grep -Eq '^v22\.'
          env -i PATH="$isolated_path" npm --version
          env -i PATH="$isolated_path" java -version 2>&1 | grep -E 'version "21'
          env -i PATH="$isolated_path" pg_isready -h 127.0.0.1 -p 5432 -U pilot -d pilot
          # Worker command environment keeps only SAFE_ENV_KEYS (not PGPASSWORD).
          # URL is intentionally local and disposable, never a production secret.
          isolated_home="$(mktemp -d)"
          trap 'rm -rf "$isolated_home"' EXIT
          env -i PATH="$isolated_path" HOME="$isolated_home" LANG=C.UTF-8 \
            psql -w -X -v ON_ERROR_STOP=1 \
              'postgresql://pilot:pilot@127.0.0.1:5432/pilot' \
              -Atqc 'SELECT 1' | grep -qx 1
          echo CP1_1_ISOLATED_TOOLCHAIN_PASS
      - name: Install fixed Playwright Chromium headless for FRONTEND acceptance
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_BROWSERS_PATH=/tmp/lf-playwright-browsers \
            /tmp/lf-python-runtime/bin/python -m playwright install --with-deps --only-shell chromium
          PLAYWRIGHT_BROWSERS_PATH=/tmp/lf-playwright-browsers \
            /tmp/lf-python-runtime/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
      - name: Install age v1.3.2 from SHA-256 pinned GitHub Releases tarball
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age-v1.3.2-linux-amd64.tar.gz"
          url="https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 "$url" --output "$archive"
          printf '%s  %s\n' 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' "$archive" | sha256sum --check --status || {
            echo AGE_TARBALL_SHA_DRIFT >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/age-extract" "$RUNNER_TEMP/age-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/age-extract"
          test -f "$RUNNER_TEMP/age-extract/age/age"
          install -m 0755 "$RUNNER_TEMP/age-extract/age/age" "$RUNNER_TEMP/age-bin/age"
          "$RUNNER_TEMP/age-bin/age" --version | grep -Fq 'v1.3.2'
# <<< ENVIRONMENT
      - name: Check live request lifecycle before rehearsal
        if: steps.boot.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TASK_INPUT: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ -n "$TASK_INPUT" ]; then
            sel=(--task "$TASK_INPUT")
          elif [ -n "$BASE_SHA" ]; then
            sel=(--changed-since "$BASE_SHA")
          else
            # Train-dispatched on a bot branch: compare with trusted main.
            sel=(--changed-since "$(git -C data merge-base HEAD origin/main)")
          fi
          python3 control/pilot/worker_v08/exam_rehearsal.py \
            --control control --data data --private "$RUNNER_TEMP/rehearsal-private" \
            --lifecycle-only "${sel[@]}"

      - name: Rehearse changed exams with the original Worker
        if: steps.boot.outputs.ready == 'true'
        env:
          PILOT_HOLDOUT_AGE_KEY: ${{ secrets.PILOT_HOLDOUT_AGE_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TASK_INPUT: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ -n "$TASK_INPUT" ]; then
            sel=(--task "$TASK_INPUT")
          elif [ -n "$BASE_SHA" ]; then
            sel=(--changed-since "$BASE_SHA")
          else
            # Train-dispatched on a bot branch: compare with trusted main.
            sel=(--changed-since "$(git -C data merge-base HEAD origin/main)")
          fi
          python3 control/pilot/worker_v08/exam_rehearsal.py \
            --control control --data data --private "$RUNNER_TEMP/rehearsal-private" \
            --age-bin "$RUNNER_TEMP/age-bin/age" "${sel[@]}"
