name: F5.1 Analysis package intake and conservative PG04 bridge (offline)
on:
  pull_request:
    paths:
      - 'pilot/orchestrator/package_to_lots.py'
      - 'pilot/orchestrator/test_package_to_lots.py'
      - 'pilot/runs/f5-login/**'
      - '.github/workflows/f5-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f5-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2 jsonschema==4.25.1
      - name: Reconstruct sandbox-only A1-A5 skill alias used by F0 test harness
        run: |
          mkdir -p skills
          ln -s ../analysis/programming_analysis skills/programming_analysis
      - name: A9 actual package, unchanged intake, no model or Supabase
        run: |
          python3 -m analysis.host.run_a1_a9_fixture --root . --slug f5-login
          python3 -m pilot.orchestrator.intake --root . --request-id f5-login
          python3 -m pytest -q pilot/orchestrator/test_package_to_lots.py -p no:cacheprovider
      - name: Verify candidate contexts remain separate and no lots were invented
        run: |
          python3 - <<'PY'
          import json,pathlib
          folder=pathlib.Path('pilot/runs/f5-login')
          state=json.loads((folder/'state.json').read_text())
          assert state['stage']=='INTAKE_ACCEPTED'
          assert not (folder/'lots.json').exists()
          for area,name in (('DATA','f5data'),('BACKEND','f5backend')):
              root=pathlib.Path('.lf/worker-context')/name
              tech=json.loads((root/'reglas_tecnicas.json').read_text())
              business=json.loads((root/'reglas_negocio.json').read_text())
              assert tech['area']==business['area']==area
              assert 'STD-SEC' in tech['families']
              assert business['registration_status']=='NOT_REGISTERED'
          print('F51_CANDIDATE_BLOCKS_SEPARATED_AND_UNREGISTERED')
          PY
