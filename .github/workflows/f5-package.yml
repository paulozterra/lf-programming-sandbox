name: F5.1 Analysis package intake and conservative PG04 bridge (offline)
on:
  pull_request:
    paths:
      - 'pilot/orchestrator/package_to_lots.py'
      - 'pilot/orchestrator/test_package_to_lots.py'
      - 'pilot/runs/f5-login/**'
      - '.github/workflows/f5-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f5-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2 jsonschema==4.25.1
      - name: Reconstruct sandbox-only A1-A5 skill alias used by F0 test harness
        run: |
          mkdir -p skills
          ln -s ../analysis/programming_analysis skills/programming_analysis
      - name: A9 actual package, unchanged intake, no model or Supabase
        run: |
          python3 -m analysis.host.run_a1_a9_fixture --root "$RUNNER_TEMP" --slug f5-login
          python3 -m pilot.orchestrator.intake --root "$RUNNER_TEMP" --request-id f5-login
          python3 -m pytest -q pilot/orchestrator/test_package_to_lots.py -p no:cacheprovider
      - name: Emit byte exact candidate for source-controlled F5 intake
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'pilot/runs/f5-login'
          for name in ('request.md','analysis.json'):
              print('F51_B64_BEGIN:'+name)
              print(base64.b64encode((folder/name).read_bytes()).decode('ascii'))
              print('F51_B64_END:'+name)
          PY
