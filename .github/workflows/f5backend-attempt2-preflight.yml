name: F5 backend preflight attempt 2
on:
  push:
    branches: [lf/preflight/f5backend-attempt2]
permissions:
  contents: read
jobs:
  requested-maven-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact requested command before native proposal
        run: mvn -f apps/time-service/pom.xml spotless:check package
