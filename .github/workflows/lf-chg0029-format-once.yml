name: CHG-0029 Palantir one-time apply and javac equivalence
on:
  push:
    branches:
      - lf/chg-0029-palantir-spotless-fase2a
    paths:
      - '.github/workflows/lf-chg0029-format-once.yml'
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch and historic base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Java 21 / Maven
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply Palantir with corrected Maven includes and class equivalence
        run: |
          set -euo pipefail
          python3 evidence/palantir_2a/verify_format_migration.py --apply --receipt "$RUNNER_TEMP/CHG-0029-class-byte-receipt.json"
          mvn -B -f apps/time-service/pom.xml test
      - name: Publish immutable visible class-equivalence receipt
        uses: actions/upload-artifact@v4
        with:
          name: CHG-0029-palantir-class-byte-equivalence
          path: ${{ runner.temp }}/CHG-0029-class-byte-receipt.json
          if-no-files-found: error
      - name: Commit only Java source formatting to draft branch (never main)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "lf/chg-0029-palantir-spotless-fase2a"
          git add -- apps/time-service/src/main/java
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -vE '^apps/time-service/src/main/java/.*\.java$' || true)"
          test -z "$(git diff --name-only)"
          git -c user.name="LF Sandbox Format" -c user.email="lf-format@users.noreply.github.com" commit -m "style(chg-0029): apply Palantir once; equivalent javac -g:none classes"
          git push origin "HEAD:refs/heads/lf/chg-0029-palantir-spotless-fase2a"
          echo 'PALANTIR_CHG0029_FORMAT_COMMIT_PUSHED=true'
