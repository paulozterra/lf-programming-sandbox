name: CP3.5 native verified patch to draft PR
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CP3.5 recovery native-run-{0}', inputs.source_run_id) || format('CP3.5 {0}', github.event.workflow_run.display_title || github.run_id) }}

on:
  workflow_run:
    workflows:
      - "LF Worker native (trusted workflow_run or manual, no API)"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing immutable PASS run ID to re-integrate, never run Worker
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write
  actions: write

concurrency:
  group: cp35-native-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      NATIVE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
    steps:
      - name: Checkout trusted main only (never proposal checkout)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Confirm exact main and clean control tree
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare pinned official OpenAPI client generator
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install trusted frontend generator dependencies only
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Integrate PASS artifact into a draft PR with C9 and head-specific CI
        run: python3 -m pilot.workflow_entrypoint pilot/orchestrator/native_verified_integration.py --run-id "$NATIVE_RUN_ID"
      - name: Never approve or label ready-to-merge automatically
        if: always()
        run: |
          echo "CP35_OWNER_GATE_RETAINED: Claude reviews, Paulo labels, Train merges."
      - name: Wake request watchdog even for bot-created integration PR
        if: failure() || cancelled()  # CHG-0252: success needs no watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run request-failure-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$GITHUB_RUN_ID"
