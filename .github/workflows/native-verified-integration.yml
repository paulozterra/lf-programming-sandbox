name: CP3.5 native verified patch to draft PR

on:
  workflow_run:
    workflows:
      - "LF Worker native (trusted workflow_run or manual, no API)"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: cp35-native-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout trusted main only (never proposal checkout)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Confirm exact main and clean control tree
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Integrate PASS artifact into a draft PR with C9 and head-specific CI
        run: python3 pilot/orchestrator/native_verified_integration.py --run-id "$NATIVE_RUN_ID"
      - name: Never approve or label ready-to-merge automatically
        if: always()
        run: |
          echo "CP35_OWNER_GATE_RETAINED: Claude reviews, Paulo labels, Train merges."
