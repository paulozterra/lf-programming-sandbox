name: P4BE exact export (temporary, no model)
on:
  push:
    branches:
      - tmp/p4be-pack-export-exact
    paths:
      - .github/workflows/p4be-pack-export-once.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9ead964e71958db2004499cbeb85463e37d3696d
          path: base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Export exact native task pack (capture-only, no model or oracle)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = 9ead964e71958db2004499cbeb85463e37d3696d
          python3 - <<'PY'
          import json,pathlib
          raw=json.loads(pathlib.Path("control/pilot/worker_v08/native_tasks/p4be.json").read_text())
          spec=raw["task_spec"]
          assert spec["base_head_sha"]=="9ead964e71958db2004499cbeb85463e37d3696d"
          pathlib.Path("p4be.current-spec.json").write_text(json.dumps(spec,sort_keys=True))
          PY
          PYTHONPATH=control/vendor/programming-agent/src python3 control/pilot/worker_v08/export_task_pack.py --repo base --task-spec p4be.current-spec.json --out p4be.pack.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          raw=pathlib.Path("p4be.pack.json").read_bytes()
          pack=json.loads(raw)
          assert pack["user_payload"]["task"]["base_head_sha"]=="9ead964e71958db2004499cbeb85463e37d3696d"
          print("EXACT_P4BE_PACK", hashlib.sha256(raw).hexdigest(),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4be-exact-pack-only
          path: p4be.pack.json
          if-no-files-found: error
          retention-days: 7
