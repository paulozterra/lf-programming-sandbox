name: CP3.7 pinned PG06-PG14 evidence and H_REPORT
run-name: CP3.7 ${{ inputs.request_slug || github.event.workflow_run.head_branch || github.run_id }}
on:
  workflow_run:
    workflows: [sandbox-train]
    types: [completed]
  schedule:
    - cron: '9,29,49 * * * *'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing trusted sandbox-train run"
        required: true
        type: string
      request_slug:
        description: Request scope proven by the source Train merge
        required: false
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write
  actions: write

concurrency:
  group: cp37-h-reports
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.run_attempt == 1) ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
      PG12_TEST_DSN: postgresql://pilot:pilot@127.0.0.1:5432/pg12_test_cp37
      PG12_DISPOSABLE_DB: "YES"
      PGPASSWORD: pilot
    steps:
      - name: Trusted main checkout only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"
      - name: Maven Central mirror with Central fallback (T57)
        shell: bash
        run: |
          set -euo pipefail
          # Global settings apply to every mvn on this runner, including the
          # vendored Worker and exams that run with an isolated, empty HOME.
          maven_home="$(mvn -v | sed -n 's/^Maven home: //p')"
          test -n "$maven_home" && test -d "$maven_home/conf"
          sudo tee "$maven_home/conf/settings.xml" >/dev/null <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <profiles>
              <profile>
                <id>lf-maven-mirror</id>
                <repositories>
                  <repository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>lf-maven-mirror</activeProfile>
            </activeProfiles>
          </settings>
          XML
          grep -q "maven-central.storage-download.googleapis.com" "$maven_home/conf/settings.xml"
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify all original LF producer file pins
        run: python3 -m pilot.workflow_entrypoint pilot/lf_producers_pinned/verify_source_pin.py
      - name: Create disposable local PostgreSQL 17 (never Supabase)
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name cp37-disposable-db --network host \
            -e POSTGRES_USER=pilot -e POSTGRES_PASSWORD=pilot \
            -e POSTGRES_DB=pg12_test_cp37 \
            postgres:17 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 40); do
            if pg_isready -h 127.0.0.1 -p 5432 -U pilot -d pg12_test_cp37 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U pilot -d pg12_test_cp37
      - name: Confirm main has not moved
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Original PG producers and per-request draft H_REPORT
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/pg37_publish.py --sweep
          else
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/pg37_publish.py --source-run-id "$SOURCE_RUN_ID"
          fi
      - name: Stop local PostgreSQL
        if: always()
        run: docker stop cp37-disposable-db || true
      - name: Preserve review and Train owner gates
        if: always()
        run: |
          echo "CP37_CANDIDATE_ONLY: Claude reviews; Paulo labels; Train merges."
      - name: Wake watchdog without relying on bot-triggered workflow_run
        if: failure() || cancelled()  # CHG-0252: success needs no watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run request-failure-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$GITHUB_RUN_ID"
