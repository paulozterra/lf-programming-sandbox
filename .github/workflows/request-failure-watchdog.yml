name: T9.1 request route failure watchdog
# T52: the source run id in the title lets measure_watchdog.py count arrival paths.
run-name: "T9.1 watchdog ${{ github.event_name }} source=${{ github.event.workflow_run.id || inputs.source_run_id || 'sweep' }}"
on:
  workflow_run:
    workflows:
      - 'sandbox-train'
      - 'T9.2 trusted Train handoff dispatch'
      - 'T7 main request auto-admission (trusted, no model)'
      - 'CP3.7 pinned PG06-PG14 evidence and H_REPORT'
      - 'T9 issue request intake'
      - 'ci'
      - 'CP3.6 chain after Train merge or spent native failure'
      - 'LF Worker native (trusted workflow_run or manual, no API)'
      - 'CP3.5 native verified patch to draft PR'
      - 'LF policy C auto-integrate'
      - 'T9 request terminal status and intervention report'
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the originating trusted workflow; empty only for explicit recovery sweep"
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: write
concurrency:
  group: t9-route-failure-notify
  cancel-in-progress: false
jobs:
  notify:
    # CHG-0252: a successful or cancelled source has nothing to notify
    # (request_failure_notify short-circuits it); skip before using a runner
    # or API budget. Only failure/timed_out sources start the job.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trusted main checkout only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Notify request submitter from failed run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id || '' }}
          PYTHONDONTWRITEBYTECODE: '1'
          LF_ROUTE_EKB_CANDIDATES: ${{ runner.temp }}/route-ekb-candidates.jsonl
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_RUN_ID" ]; then
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            # Fast path: one exact source run, with comment-marker idempotence.
            python3 -m pilot.workflow_entrypoint pilot/request_failure_notify.py --run-id "$SOURCE_RUN_ID"
          else
            # Recovery only: scheduled every ten minutes, or explicit manual sweep.
            test "${{ github.event_name }}" = "schedule" -o "${{ github.event_name }}" = "workflow_dispatch"
            python3 -m pilot.workflow_entrypoint pilot/request_failure_notify.py --sweep
          fi
      - name: Record notified route failures in the EKB (T56, catalogued codes only)
        if: always()
        continue-on-error: true
        env:
          LF_EKB_ROUTE_WRITE_URL: ${{ secrets.LF_EKB_ROUTE_WRITE_URL }}
        run: |
          file="$RUNNER_TEMP/route-ekb-candidates.jsonl"
          test -s "$file" || { echo "no notified failures"; exit 0; }
          python3 -I pilot/ekb/route_ekb.py record --candidates "$file"
