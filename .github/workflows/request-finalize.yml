name: T9 request terminal status and intervention report
run-name: T9 finalize ${{ github.event.head_commit.message || github.run_id }}
on:
  push:
    branches: [main]
    paths:
      - 'pilot/runs/req-*/state.json'
      - 'pilot/runs/req-*/H_REPORT.md'
      - 'pilot/registry/implemented.json'
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write
concurrency:
  group: t9-request-finalize
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate reports for terminal request states only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m pilot.workflow_entrypoint pilot/orchestrator/request_finalize.py --out "$RUNNER_TEMP/t9-reports"
      - name: Publish intervention reports before closing any issue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t9-intervention-reports
          path: ${{ runner.temp }}/t9-reports
          retention-days: 90
          if-no-files-found: error
      - name: Notify submitter with terminal state and report link, then close
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m pilot.workflow_entrypoint pilot/orchestrator/request_finalize.py --out "$RUNNER_TEMP/t9-reports" --close
      - name: Wake watchdog without relying on bot-triggered workflow_run
        if: failure() || cancelled()  # CHG-0252: success needs no watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run request-failure-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$GITHUB_RUN_ID"
