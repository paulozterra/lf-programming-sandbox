name: T9 issue request intake
run-name: T9 intake req-${{ github.event.issue.number }}
on:
  issues:
    types: [opened, labeled, unlabeled]
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: lf-request-intake-global
  cancel-in-progress: false
jobs:
  intake:
    if: >-
      github.event_name == 'schedule' ||
      github.event.action == 'opened' ||
      (github.event.action == 'labeled' && github.event.label.name == 'lf-request') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'lf-request-duplicate')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: true
      - name: Validate collaborator and publish bot PR
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/issue_intake.py --sweep
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result="$(python3 -m pilot.workflow_entrypoint pilot/orchestrator/issue_intake.py)"
          printf '%s\n' "$result"
          # opened + labeled both fire; only the run that created the PR dispatches ci.
          if [ "$result" = "PEDIDO_YA_REGISTRADO" ] || [ "$result" = "PEDIDO_POSIBLE_DUPLICADO" ] || [ "$result" = "REQUEST_SUSPENDED" ] || [ "$result" = "REQUEST_CLOSED" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run CI for bot-created request PR
        if: success() && steps.intake.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="lf/request/req-${{ github.event.issue.number }}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            number="$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
            head_sha="$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/request_lifecycle.py --request "req-${{ github.event.issue.number }}"
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
              -f pr_number="$number" -f pr_sha="$head_sha"
          fi
