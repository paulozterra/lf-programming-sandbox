name: sandbox-train
run-name: "${{ inputs.pr_number && format('sandbox-train PR #{0}', inputs.pr_number) || github.event.pull_request.title }}"

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository PR number (must have ready-to-merge)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: sandbox-train
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'ready-to-merge' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TRAIN_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      TRAIN_RECEIPT: sandbox-train-receipt.json
    steps:
      - name: Checkout trusted train from main (never PR code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Check train policy before merge
        run: python3 -m unittest discover -s pilot -p 'test_sandbox_train_policy.py' -v
      - name: Test CAMBIOS-only conflict policy with real Git
        run: python3 -m unittest discover -s pilot -p 'test_sandbox_train_merge.py' -v
      - name: Merge checked HEAD; fail closed
        env:
          # T47: owner-provided token with Contents+Workflows write so PRs that
          # touch .github/workflows/ can be merged; falls back to github.token.
          GH_TOKEN: ${{ secrets.TRAIN_PUSH_TOKEN || github.token }}
        run: python3 -m pilot.workflow_entrypoint pilot/sandbox_train.py
      - name: Publish merge receipt (no custom secrets)
        if: success()
        run: cat "$TRAIN_RECEIPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch next stage explicitly after authenticated merge
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(jq -r '.event' "$TRAIN_RECEIPT")" = "MERGED"
          test "$(jq -r '.pr' "$TRAIN_RECEIPT")" = "$TRAIN_PR"
          merge_sha="$(jq -er '.merge_sha | select(test("^[a-f0-9]{40}$"))' "$TRAIN_RECEIPT")"
          gh workflow run train-handoff.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f pr_number="$TRAIN_PR" -f merge_sha="$merge_sha" \
            -f train_run_id="$GITHUB_RUN_ID"
