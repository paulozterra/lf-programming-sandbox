name: T7 main request auto-admission (trusted, no model)
run-name: T7 ${{ inputs.slug || github.sha }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Exact request slug from verified Train merge
        required: true
        type: string
      merge_sha:
        description: Exact first-parent Train merge SHA
        required: true
        type: string
      rerun:
        description: T12 recovery of previously accepted request on current main
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  push:
    branches: [main]
    paths:
      - 'pilot/runs/*/request.md'

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: t7-request-admission
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main, not an untrusted proposal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned host and contract validation requirements
        run: python3 -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1 PyYAML==6.0.3 openapi-spec-validator==0.7.2
      - name: Prepare shared disposable selector with T1 patterns
        run: bash pilot/orchestrator/prepare_selector.sh
      - name: Validate explicit Train dispatch against trusted main
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m pilot.workflow_entrypoint pilot/train_handoff.py --verify-t7 --slug "${{ inputs.slug }}" --merge-sha "${{ inputs.merge_sha }}"
      - name: Resolve exactly the requests submitted in this main commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'pilot/runs/%s/request.md\n' "${{ inputs.slug }}" > "$RUNNER_TEMP/t7-requests.txt"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/t7_pending_reconcile.py \
              --out "$RUNNER_TEMP/t7-requests.txt"
          else
            git diff "$GITHUB_SHA^1" "$GITHUB_SHA" --name-only \
              | grep -E '^pilot/runs/[a-z][a-z0-9_-]{0,63}/request[.]md$' \
              > "$RUNNER_TEMP/t7-requests.txt"
          fi
          if [ ! -s "$RUNNER_TEMP/t7-requests.txt" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$base"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          while IFS= read -r file; do
            slug="$(basename "$(dirname "$file")")"
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/request_lifecycle.py --request "$slug"
            python3 -m pilot.workflow_entrypoint pilot/orchestrator/t7_entry.py --root . \
              --request-id "$slug" --base-head-sha "$base"
          done < "$RUNNER_TEMP/t7-requests.txt"
      - name: Stage generated evidence only in a governed Draft PR
        if: steps.resolve.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.resolve.outputs.base_sha }}"
          short_sha="$(printf '%s' "$base" | cut -c1-12)"
          branch="lf/generated-t7/$short_sha"
          if [ "${{ inputs.rerun || 'false' }}" = "true" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # T33.2: plain path parsing (the escaped sed never matched, so every
            # T12 re-run died here silently with exit 1).
            first="$(head -n 1 "$RUNNER_TEMP/t7-requests.txt")"
            [[ "$first" =~ ^pilot/runs/(req-[1-9][0-9]*)/request[.]md$ ]]
            slug="${BASH_REMATCH[1]}"
            [[ "$slug" =~ ^req-[1-9][0-9]*$ ]]
            test "$(wc -l < "$RUNNER_TEMP/t7-requests.txt")" -eq 1
            branch="lf/generated-t7/$short_sha-$slug"
          fi
          git switch -c "$branch"
          while IFS= read -r file; do
            slug="$(basename "$(dirname "$file")")"
            git add -- "pilot/runs/$slug"
            if [ -f "pilot/orchestrator/chain_plans/$slug.json" ]; then
              cp -- "pilot/orchestrator/chain_plans/$slug.json" "pilot/runs/$slug/chain_plan.json"
            fi
            git add -- "pilot/runs/$slug"
            # The generated proposal cannot modify the submitted request itself.
            git reset -q -- "pilot/runs/$slug/request.md"
          done < "$RUNNER_TEMP/t7-requests.txt"
          # Contract skeletons outside pilot/runs are not auto-integrable:
          # generated evidence PRs have one strictly closed path family.
          if git diff --cached --quiet; then
            echo T7_NO_NEW_ARTIFACTS
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'T7 generated request analysis, reuse assessment and chain'
          python3 -m pilot.workflow_entrypoint pilot/orchestrator/generated_branch_standards.py \
            --kind generated-t7 --base "$base"
          guard_requests() {
            while IFS= read -r file; do
              slug="$(basename "$(dirname "$file")")"
              python3 -m pilot.workflow_entrypoint pilot/orchestrator/request_lifecycle.py --request "$slug"
            done < "$RUNNER_TEMP/t7-requests.txt"
          }
          guard_requests
          git push --set-upstream origin "$branch"
          guard_requests
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --draft --title "[DRAFT][T7] generated admission for $short_sha" \
            --body "Trusted main request input; A1-A9 candidate, source-derived reuse, intake, planning and chain. Owner/Train governance retained. No oracle, model, labels, or direct push to main."
          # PRs created with GITHUB_TOKEN do not automatically trigger CI.
          guard_requests
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
      - name: Stop selector's disposable database
        if: always()
        run: docker stop selector-disposable-db || true
      - name: Wake route watchdog even when T7 fails
        if: failure() || cancelled()  # CHG-0252: success needs no watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run request-failure-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$GITHUB_RUN_ID"
