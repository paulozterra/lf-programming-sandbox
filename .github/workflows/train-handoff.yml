name: T9.2 trusted Train handoff dispatch
run-name: Train handoff PR ${{ inputs.pr_number }}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged Train PR number
        required: true
        type: string
      merge_sha:
        description: Exact verified merge SHA
        required: true
        type: string
      train_run_id:
        description: Successful sandbox-train run ID
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: train-handoff-${{ inputs.merge_sha }}
  cancel-in-progress: false

jobs:
  route:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main, never PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Train merger, dispatch ci.yml on exact main, gate next stage
        # The gate waits for completed main CI; a failed CI blocks CP3.6.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m pilot.workflow_entrypoint pilot/train_handoff.py \
            --pr "${{ inputs.pr_number }}" \
            --merge-sha "${{ inputs.merge_sha }}" \
            --train-run-id "${{ inputs.train_run_id }}"
      - name: Wake watchdog without relying on workflow_run or cron
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run request-failure-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$GITHUB_RUN_ID"
  watch:
    name: Watch next stage without cron
    needs: route
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout trusted current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for exactly the expected next workflow or report stalled stage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m pilot.workflow_entrypoint pilot/request_stage_watchdog.py --watch \
            --pr "${{ inputs.pr_number }}" \
            --merge-sha "${{ inputs.merge_sha }}" \
            --train-run-id "${{ inputs.train_run_id }}"
