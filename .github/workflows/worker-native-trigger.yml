name: LF Native proposal trigger
run-name: lf-native-trigger

on:
  push:
    branches:
      - 'lf/native-proposal/**'

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  verify-native-proposal:
    name: Validate single registered proposal (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main for validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Validate event branch, commit and single proposal JSON
        shell: bash
        env:
          PROPOSAL_SHA: ${{ github.sha }}
          PROPOSAL_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PROPOSAL_BRANCH" == lf/native-proposal/* ]]
          # Checkout and validation code come exclusively from trusted main.
          # No code from the pushed commit is ever executed or checked out.
          if ! git -C control fetch --no-tags origin "$PROPOSAL_SHA"; then
            code=NATIVE_PUSH_SHA_UNAVAILABLE
            printf '%s\\n' "$code" >&2
          else
            set +e
            python3 control/pilot/worker_v08/native_proposal_push_guard.py \
              --control control --sha "$PROPOSAL_SHA" --branch "$PROPOSAL_BRANCH" \
              > /tmp/native-guard.out 2> /tmp/native-guard.err
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then
              python3 control/pilot/worker_v08/request_lifecycle_gate.py \
                --control control --task "${PROPOSAL_BRANCH#lf/native-proposal/}"
              cat /tmp/native-guard.out
              exit 0
            fi
            code="$(head -n 1 /tmp/native-guard.err)"
            if [[ ! "$code" =~ ^NATIVE_[A-Z0-9_]+$ ]]; then
              code=NATIVE_PUSH_GUARD_FAILED
            fi
            printf '%s\\n' "$code" >&2
          fi
          # Only a verified, issue-backed task gets a comment. Notification
          # failure does not suppress the exact guard error or greenlight push.
          python3 control/pilot/worker_v08/native_push_failure_notify.py \
            --control control --sha "$PROPOSAL_SHA" \
            --branch "$PROPOSAL_BRANCH" --code "$code" || :
          exit 1
