name: LF Worker native (trusted workflow_run or manual, no API)
run-name: ${{ github.event_name == 'workflow_run' && format('lf-native-auto-{0}-{1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) || format('lf-native-{0}-a{1}', inputs.task, inputs.attempt) }}

on:
  workflow_run:
    workflows: ["LF Native proposal trigger"]
    types: [completed]
  workflow_dispatch:
    inputs:
      task:
        description: "Registered task matching pilot/native_proposals/<task>.json"
        required: true
        type: string
      proposal_commit_sha:
        description: "Immutable 40-hex Git commit; read proposal JSON only"
        required: true
        type: string
      attempt:
        description: "One CI run per attempt; 1 to 3"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: lf-worker-native-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || format('lf/native-proposal/{0}', inputs.task) }}
  cancel-in-progress: false

jobs:
  native:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilot
          POSTGRES_DB: pilot
          POSTGRES_PASSWORD: pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted main control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Independently attest source workflow and exact proposal-only commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MANUAL_SHA: ${{ inputs.proposal_commit_sha }}
          MANUAL_TASK: ${{ inputs.task }}
          MANUAL_ATTEMPT: ${{ inputs.attempt }}
          REPO_NAME: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # workflow_run.name is the trigger run-name, not its workflow display name.
            test "$TRIGGER_NAME" = "lf-native-trigger"
            test "$TRIGGER_EVENT" = "push"
            test "$TRIGGER_CONCLUSION" = "success"
            test "$TRIGGER_REPO" = "$REPO_NAME"
            [[ "$TRIGGER_PATH" == ".github/workflows/worker-native-trigger.yml" || "$TRIGGER_PATH" == ".github/workflows/worker-native-trigger.yml@"* ]]
            [[ "$TRIGGER_BRANCH" == lf/native-proposal/* ]]
            sha="$TRIGGER_SHA"
            branch="$TRIGGER_BRANCH"
          else
            test "$EVENT_NAME" = "workflow_dispatch"
            [[ "$MANUAL_ATTEMPT" =~ ^[123]$ ]]
            sha="$MANUAL_SHA"
            branch=""
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git -C control fetch --no-tags origin "$sha"
          args=(--control control --sha "$sha" --github-output "$GITHUB_OUTPUT")
          if [ -n "$branch" ]; then
            args+=(--branch "$branch")
          fi
          python3 control/pilot/worker_v08/native_proposal_push_guard.py "${args[@]}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            derived="$(sed -n 's/^task=//p' "$GITHUB_OUTPUT" | tail -1)"
            test "$derived" = "$MANUAL_TASK"
          fi
          printf 'proposal_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up Java 21 for EX6 (SHA pinned)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # pinned commit, Temurin
        with:
          distribution: temurin
          java-version: "21"

      - name: Link JDK 21 and Maven into the vendored Worker's fixed PATH (EX6)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME:-}" && test -x "$JAVA_HOME/bin/java"
          for tool in java javac jar; do
            test -x "$JAVA_HOME/bin/$tool"
            sudo ln -sfn "$JAVA_HOME/bin/$tool" "/usr/local/bin/$tool"
          done
          maven_source="$(command -v mvn)"
          test -n "$maven_source"
          maven_source="$(readlink -f "$maven_source")"
          test -x "$maven_source"
          sudo ln -sfn "$maven_source" /usr/local/bin/mvn

      - name: Verify isolated Worker command environment uses Java 21 and Maven (EX6)
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$(mktemp -d)"
          trap 'rm -rf "$isolated_home"' EXIT
          isolated_path="/usr/local/bin:/usr/bin:/bin"
          # Match worker_commands._command_environment: absolutely no JAVA_HOME.
          env -i PATH="$isolated_path" HOME="$isolated_home" /bin/bash -c '
            set -euo pipefail
            test -z "${JAVA_HOME:-}"
            test "$(command -v java)" = "/usr/local/bin/java"
            test "$(command -v javac)" = "/usr/local/bin/javac"
            test "$(command -v jar)" = "/usr/local/bin/jar"
            test "$(command -v mvn)" = "/usr/local/bin/mvn"
          '
          java_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" java -version 2>&1)"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.+_-]|")'
          maven_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" mvn -v 2>&1)"
          printf '%s\n' "$maven_version" | grep -Eq 'Apache Maven '
          printf '%s\n' "$maven_version" | grep -Eq 'Java version: 21([.+_-]|[, ]|$)'
          echo "EX6_ISOLATED_JAVA21_AND_MAVEN_PASS"
      - name: Set up Node 22 for isolated Worker
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Expose Node, npm and PostgreSQL client in Worker fixed PATH
        shell: bash
        run: |
          set -euo pipefail
          for binary in node npm psql pg_isready; do
            resolved="$(readlink -f "$(command -v "$binary")")"
            test -x "$resolved"
            sudo ln -sfn "$resolved" "/usr/local/bin/$binary"
          done
      - name: Smoke-test isolated Node, npm, Java and disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          isolated_path="/usr/local/bin:/usr/bin:/bin"
          for binary in node npm psql pg_isready; do
            test "$(/usr/bin/env -i PATH="$isolated_path" /bin/sh -c "command -v $binary")" = "/usr/local/bin/$binary"
          done
          env -i PATH="$isolated_path" node --version | grep -Eq '^v22\.'
          env -i PATH="$isolated_path" npm --version
          env -i PATH="$isolated_path" java -version 2>&1 | grep -E 'version "21'
          env -i PATH="$isolated_path" pg_isready -h 127.0.0.1 -p 5432 -U pilot -d pilot
          # Worker command environment keeps only SAFE_ENV_KEYS (not PGPASSWORD).
          # URL is intentionally local and disposable, never a production secret.
          isolated_home="$(mktemp -d)"
          trap 'rm -rf "$isolated_home"' EXIT
          env -i PATH="$isolated_path" HOME="$isolated_home" LANG=C.UTF-8 \
            psql -w -X -v ON_ERROR_STOP=1 \
              'postgresql://pilot:pilot@127.0.0.1:5432/pilot' \
              -Atqc 'SELECT 1' | grep -qx 1
          echo CP1_1_ISOLATED_TOOLCHAIN_PASS
      - name: Install fixed Playwright Chromium headless for FRONTEND acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/lf-playwright-runtime
          /tmp/lf-playwright-runtime/bin/python -m pip install --disable-pip-version-check --no-input playwright==1.56.0
          PLAYWRIGHT_BROWSERS_PATH=/tmp/lf-playwright-browsers \
            /tmp/lf-playwright-runtime/bin/python -m playwright install --with-deps --only-shell chromium
          PLAYWRIGHT_BROWSERS_PATH=/tmp/lf-playwright-browsers \
            /tmp/lf-playwright-runtime/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
      - name: Check vendored source integrity before execution
        run: python3 control/pilot/worker_v08/verify_vendor.py
      - name: Admit task and registered base (fail closed until Claude registers ex6)
        id: task
        run: |
          python3 control/pilot/worker_v08/native_run.py preflight \
            --control control --task "${{ steps.source.outputs.task }}" --github-output "$GITHUB_OUTPUT"
      - name: Ensure task base is an ancestor of trusted main
        env:
          TASK_BASE_SHA: ${{ steps.task.outputs.base_sha }}
        run: git -C control merge-base --is-ancestor "$TASK_BASE_SHA" HEAD
      - name: Determine and gate attempt from trusted GitHub history
        id: history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_TASK: ${{ steps.source.outputs.task }}
          PROPOSAL_SHA: ${{ steps.source.outputs.proposal_sha }}
          MANUAL_ATTEMPT: ${{ inputs.attempt }}
          NATIVE_PROPOSAL_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          args=(--task "$NATIVE_TASK" --sha "$PROPOSAL_SHA"
            --out "$RUNNER_TEMP/native-run-history.json" --github-output "$GITHUB_OUTPUT")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--attempt "$MANUAL_ATTEMPT")
          fi
          python3 control/pilot/worker_v08/native_run_history.py "${args[@]}"
      - name: Checkout task baseline commit from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.task.outputs.base_sha }}
          path: source
          persist-credentials: false
      - name: Checkout untrusted proposal commit (data only, no execution)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.proposal_sha }}
          path: proposal
          sparse-checkout: pilot/native_proposals/${{ steps.source.outputs.task }}.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exact proposal checkout HEAD
        env:
          PROPOSAL_SHA: ${{ steps.source.outputs.proposal_sha }}
        run: |
          test "$(git -C proposal rev-parse HEAD)" = "$PROPOSAL_SHA"
          test -f "proposal/pilot/native_proposals/${{ steps.source.outputs.task }}.json"
          test ! -L "proposal/pilot/native_proposals/${{ steps.source.outputs.task }}.json"
      - name: Install age v1.3.2 from SHA-256 pinned GitHub Releases tarball
        if: ${{ steps.task.outputs.holdout_ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age-v1.3.2-linux-amd64.tar.gz"
          url="https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 "$url" --output "$archive"
          printf '%s  %s\n' 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' "$archive" | sha256sum --check --status || {
            echo AGE_TARBALL_SHA_DRIFT >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/age-extract" "$RUNNER_TEMP/age-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/age-extract"
          test -f "$RUNNER_TEMP/age-extract/age/age"
          install -m 0755 "$RUNNER_TEMP/age-extract/age/age" "$RUNNER_TEMP/age-bin/age"
          "$RUNNER_TEMP/age-bin/age" --version | grep -Fq 'v1.3.2'
      - name: Decode task-selected external oracle to private runner path with SHA gate
        env:
          HOLDOUT_REF: ${{ steps.task.outputs.holdout_ref }}
          NATIVE_TASK: ${{ steps.source.outputs.task }}
          PILOT_HOLDOUT_AGE_KEY: ${{ secrets.PILOT_HOLDOUT_AGE_KEY }}
          PILOT_HOLDOUT_B64: ${{ secrets[format('PILOT_HOLDOUT_{0}_B64', steps.source.outputs.secret_task)] }}
          EXPECTED_SHA: ${{ steps.task.outputs.holdout_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$HOLDOUT_REF" ]; then
            test -f control/pilot/holdouts/recipient.txt
            test ! -L control/pilot/holdouts/recipient.txt
            python3 control/pilot/worker_v08/holdout_age.py \
              --validate-recipient control/pilot/holdouts/recipient.txt
            python3 control/pilot/worker_v08/holdout_age.py \
              --control control --task "$NATIVE_TASK" \
              --ref "$HOLDOUT_REF" --expected-sha "$EXPECTED_SHA" \
              --private "$RUNNER_TEMP/native-private" \
              --age-bin "$RUNNER_TEMP/age-bin/age"
          else
            # Legacy ex6/ex7/ex8: preserve the current per-task B64 secret path.
            python3 - <<'PY'
          import base64,hashlib,os,pathlib,re
          encoded=os.environ.get("PILOT_HOLDOUT_B64","")
          expected=os.environ.get("EXPECTED_SHA","")
          if not encoded or not re.fullmatch(r"[0-9a-f]{64}",expected):
              raise SystemExit("NATIVE_HOLDOUT_NOT_REGISTERED")
          raw=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit("NATIVE_HOLDOUT_SHA_DRIFT")
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-private"/"holdout.oracle.json"
          path.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
          with path.open("xb") as out:
              out.write(raw)
          path.chmod(0o600)
          PY
          fi
      - name: Execute original run_verified_worker using native proposal (single attempt)
        id: worker
        env:
          NATIVE_TASK: ${{ steps.source.outputs.task }}
          NATIVE_ATTEMPT: ${{ steps.history.outputs.attempt }}
          NATIVE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 control/pilot/worker_v08/native_run.py execute \
            --control control --source source --proposal proposal \
            --private "$RUNNER_TEMP/native-private" \
            --task "$NATIVE_TASK" --attempt "$NATIVE_ATTEMPT" --run-id "$NATIVE_RUN_ID"
      - name: Upload CI-generated attempt proof for future run admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-attempt-proof
          path: ${{ runner.temp }}/native-private/public/attempt-proof.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload cost and visible-only feedback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-visible-feedback-and-cost
          path: |
            ${{ runner.temp }}/native-private/public/feedback.json
            ${{ runner.temp }}/native-private/public/cost.json
            ${{ runner.temp }}/native-private/public/status.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Publish LF rule coverage table separately from pinned PG-07 proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-lf-rule-coverage
          path: ${{ runner.temp }}/native-private/public/lf-rule-report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Deliver patch only after verified PASS
        if: ${{ steps.worker.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-verified-patch
          path: ${{ runner.temp }}/native-private/public/worker.patch
          if-no-files-found: error
          retention-days: 90
