name: LF Worker native (manual or proposal push, no API)
run-name: ${{ github.event_name == 'push' && 'lf-native-ex6-push' || format('lf-native-{0}-a{1}', inputs.task, inputs.attempt) }}

on:
  push:
    branches:
      - 'lf/native-proposal/**'
    paths:
      - 'pilot/native_proposals/*.json'
  workflow_dispatch:
    inputs:
      task:
        description: "Registered native task (ex6 is registered separately by Claude)"
        required: true
        type: choice
        options:
          - ex6
      proposal_commit_sha:
        description: "Immutable 40-hex Git commit; read proposal JSON only"
        required: true
        type: string
      attempt:
        description: "One CI run per attempt; 1 to 3"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: lf-worker-native-${{ github.event_name == 'push' && 'ex6' || inputs.task }}
  cancel-in-progress: false

jobs:
  native:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lf/native-proposal/')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Resolve event inputs, reject unsupported manual attempts
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROPOSAL_SHA_INPUT: ${{ inputs.proposal_commit_sha }}
          MANUAL_ATTEMPT: ${{ inputs.attempt }}
          MANUAL_TASK: ${{ inputs.task }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,re
          push=os.environ["EVENT_NAME"]=="push"
          task="ex6" if push else os.environ["MANUAL_TASK"]
          sha=os.environ["PUSH_SHA"] if push else os.environ["PROPOSAL_SHA_INPUT"]
          if task!="ex6" or re.fullmatch(r"[0-9a-f]{40}",sha) is None:
              raise SystemExit("INVALID_NATIVE_PROPOSAL_INPUT")
          if not push and os.environ["MANUAL_ATTEMPT"] not in ("1","2","3"):
              raise SystemExit("INVALID_NATIVE_MANUAL_ATTEMPT")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("task=ex6\nproposal_sha="+sha+"\n")
          PY
      - name: Checkout trusted main control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce proposal-only push and exact trusted-main ancestry before secrets
        if: github.event_name == 'push'
        shell: bash
        env:
          PROPOSAL_SHA: ${{ steps.source.outputs.proposal_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$PROPOSAL_SHA"
          git -C control fetch --no-tags origin "$PROPOSAL_SHA"
          git -C control merge-base --is-ancestor HEAD "$PROPOSAL_SHA"
          mapfile -t changes < <(git -C control diff --name-status HEAD "$PROPOSAL_SHA")
          test "${#changes[@]}" -eq 1
          test "${changes[0]}" = $'A\tpilot/native_proposals/ex6.json' ||
            test "${changes[0]}" = $'M\tpilot/native_proposals/ex6.json'
          git -C control show "$PROPOSAL_SHA:pilot/native_proposals/ex6.json" > "$RUNNER_TEMP/native-ex6-checked.json"
          python3 -m json.tool "$RUNNER_TEMP/native-ex6-checked.json" >/dev/null
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up Java 21 for EX6 (SHA pinned)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # pinned commit, Temurin
        with:
          distribution: temurin
          java-version: "21"

      - name: Link JDK 21 and Maven into the vendored Worker's fixed PATH (EX6)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME:-}" && test -x "$JAVA_HOME/bin/java"
          for tool in java javac jar; do
            test -x "$JAVA_HOME/bin/$tool"
            sudo ln -sfn "$JAVA_HOME/bin/$tool" "/usr/local/bin/$tool"
          done
          maven_source="$(command -v mvn)"
          test -n "$maven_source"
          maven_source="$(readlink -f "$maven_source")"
          test -x "$maven_source"
          sudo ln -sfn "$maven_source" /usr/local/bin/mvn

      - name: Verify isolated Worker command environment uses Java 21 and Maven (EX6)
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$(mktemp -d)"
          trap 'rm -rf "$isolated_home"' EXIT
          isolated_path="/usr/local/bin:/usr/bin:/bin"
          # Match worker_commands._command_environment: absolutely no JAVA_HOME.
          env -i PATH="$isolated_path" HOME="$isolated_home" /bin/bash -c '
            set -euo pipefail
            test -z "${JAVA_HOME:-}"
            test "$(command -v java)" = "/usr/local/bin/java"
            test "$(command -v javac)" = "/usr/local/bin/javac"
            test "$(command -v jar)" = "/usr/local/bin/jar"
            test "$(command -v mvn)" = "/usr/local/bin/mvn"
          '
          java_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" java -version 2>&1)"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.+_-]|")'
          maven_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" mvn -v 2>&1)"
          printf '%s\n' "$maven_version" | grep -Eq 'Apache Maven '
          printf '%s\n' "$maven_version" | grep -Eq 'Java version: 21([.+_-]|[, ]|$)'
          echo "EX6_ISOLATED_JAVA21_AND_MAVEN_PASS"
      - name: Check vendored source integrity before execution
        run: python3 control/pilot/worker_v08/verify_vendor.py
      - name: Admit task and registered base (fail closed until Claude registers ex6)
        id: task
        run: |
          python3 control/pilot/worker_v08/native_run.py preflight \
            --control control --task "${{ steps.source.outputs.task }}" --github-output "$GITHUB_OUTPUT"
      - name: Ensure task base is an ancestor of trusted main
        env:
          TASK_BASE_SHA: ${{ steps.task.outputs.base_sha }}
        run: git -C control merge-base --is-ancestor "$TASK_BASE_SHA" HEAD
      - name: Determine and gate attempt from trusted GitHub history
        id: history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_TASK: ${{ steps.source.outputs.task }}
          PROPOSAL_SHA: ${{ steps.source.outputs.proposal_sha }}
          MANUAL_ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          args=(--task "$NATIVE_TASK" --sha "$PROPOSAL_SHA"
            --out "$RUNNER_TEMP/native-run-history.json" --github-output "$GITHUB_OUTPUT")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--attempt "$MANUAL_ATTEMPT")
          fi
          python3 control/pilot/worker_v08/native_run_history.py "${args[@]}"
      - name: Checkout task baseline commit from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.task.outputs.base_sha }}
          path: source
          persist-credentials: false
      - name: Checkout untrusted proposal commit (data only, no execution)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.proposal_sha }}
          path: proposal
          sparse-checkout: pilot/native_proposals/ex6.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exact proposal checkout HEAD
        env:
          PROPOSAL_SHA: ${{ steps.source.outputs.proposal_sha }}
        run: |
          test "$(git -C proposal rev-parse HEAD)" = "$PROPOSAL_SHA"
          test -f proposal/pilot/native_proposals/ex6.json
          test ! -L proposal/pilot/native_proposals/ex6.json
      - name: Decode the external ex6 oracle to private runner path with SHA gate
        env:
          PILOT_HOLDOUT_EX6_B64: ${{ secrets.PILOT_HOLDOUT_EX6_B64 }}
          EXPECTED_SHA: ${{ steps.task.outputs.holdout_sha256 }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,re
          encoded=os.environ.get("PILOT_HOLDOUT_EX6_B64","")
          expected=os.environ.get("EXPECTED_SHA","")
          if not encoded or not re.fullmatch(r"[0-9a-f]{64}",expected):
              raise SystemExit("EX6_HOLDOUT_NOT_REGISTERED")
          raw=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit("EX6_HOLDOUT_SHA_DRIFT")
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-private"/"holdout.oracle.json"
          path.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
          with path.open("xb") as out:
              out.write(raw)
          path.chmod(0o600)
          PY
      - name: Execute original run_verified_worker using native proposal (single attempt)
        id: worker
        env:
          NATIVE_TASK: ${{ steps.source.outputs.task }}
          NATIVE_ATTEMPT: ${{ steps.history.outputs.attempt }}
          NATIVE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 control/pilot/worker_v08/native_run.py execute \
            --control control --source source --proposal proposal \
            --private "$RUNNER_TEMP/native-private" \
            --task "$NATIVE_TASK" --attempt "$NATIVE_ATTEMPT" --run-id "$NATIVE_RUN_ID"
      - name: Upload CI-generated attempt proof for future run admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-attempt-proof
          path: ${{ runner.temp }}/native-private/public/attempt-proof.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload cost and visible-only feedback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-visible-feedback-and-cost
          path: |
            ${{ runner.temp }}/native-private/public/feedback.json
            ${{ runner.temp }}/native-private/public/cost.json
            ${{ runner.temp }}/native-private/public/status.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Deliver patch only after verified PASS
        if: ${{ steps.worker.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-verified-patch
          path: ${{ runner.temp }}/native-private/public/worker.patch
          if-no-files-found: error
          retention-days: 90
