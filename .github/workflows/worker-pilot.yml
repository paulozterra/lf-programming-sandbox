name: LF Worker v0.8 pilot — manual verified Worker only

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Fixed pilot exercise; exercise-2 requires Claude's holdout SHA"
        required: true
        type: choice
        options:
          - exercise-1
          - exercise-2
          - exercise-3
        default: exercise-1
      provider:
        description: "Pilot provider (only anthropic)"
        required: true
        type: choice
        options:
          - anthropic
        default: anthropic
      model:
        description: "Only approved model in this phase"
        required: true
        type: choice
        options:
          - claude-haiku-5-5
          - claude-sonnet-5-5
        default: claude-haiku-5-5
      max_attempts:
        description: "One, two or three Worker attempts (budget-gated)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"

permissions:
  contents: read

concurrency:
  group: lf-worker-v08-pilot-single-running-job
  cancel-in-progress: false

jobs:
  worker-pilot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.task == 'exercise-3' && 30 || 10 }}
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PILOT_TASK: ${{ inputs.task }}
      PILOT_PROVIDER: ${{ inputs.provider }}
      PILOT_MODEL: ${{ inputs.model }}
      PILOT_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
    steps:
      - name: Checkout private sandbox source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA pinned
        with:
          path: source
          persist-credentials: false

      - name: Set up Python runtime (SHA pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, SHA pinned
        with:
          python-version: "3.12"

      - name: Validate manual inputs and verify every vendored Worker byte BEFORE install
        id: vendor
        shell: bash
        run: |
          set -euo pipefail
          case "$PILOT_TASK" in exercise-1|exercise-2|exercise-3) ;; *) exit 1 ;; esac
          if [ "$PILOT_TASK" = exercise-3 ]; then
            test "$PILOT_MODEL" = claude-sonnet-5-5
            test "$PILOT_MAX_ATTEMPTS" = 1
          fi
          test "$PILOT_PROVIDER" = "anthropic"
          case "$PILOT_MODEL" in claude-haiku-5-5|claude-sonnet-5-5) ;; *) exit 1 ;; esac
          case "$PILOT_MAX_ATTEMPTS" in 1|2|3) ;; *) exit 1 ;; esac
          python3 source/pilot/worker_v08/verify_vendor.py \
            --root "$GITHUB_WORKSPACE/source/vendor/programming-agent"
          python3 source/pilot/worker_v08/test_verify_vendor.py

      - name: Block missing task-specific holdout SHA before model or secrets
        id: task_sha
        shell: bash
        run: |
          set -euo pipefail
          python3 source/pilot/worker_v08/task_selector.py \
            --task "$PILOT_TASK" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Java 21 ONLY for exercise-3 (SHA pinned)
        if: ${{ inputs.task == 'exercise-3' }}
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # pinned commit, Temurin
        with:
          distribution: temurin
          java-version: "21"

      - name: Link JDK 21 and Maven into the vendored Worker's fixed PATH (exercise-3 only)
        if: ${{ inputs.task == 'exercise-3' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME:-}" && test -x "$JAVA_HOME/bin/java"
          for tool in java javac jar; do
            test -x "$JAVA_HOME/bin/$tool"
            sudo ln -sfn "$JAVA_HOME/bin/$tool" "/usr/local/bin/$tool"
          done
          maven_source="$(command -v mvn)"
          test -n "$maven_source"
          maven_source="$(readlink -f "$maven_source")"
          test -x "$maven_source"
          sudo ln -sfn "$maven_source" /usr/local/bin/mvn

      - name: Verify isolated Worker command environment uses Java 21 and Maven (exercise-3 only)
        if: ${{ inputs.task == 'exercise-3' }}
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$(mktemp -d)"
          trap 'rm -rf "$isolated_home"' EXIT
          isolated_path="/usr/local/bin:/usr/bin:/bin"
          # Match worker_commands._command_environment: absolutely no JAVA_HOME.
          env -i PATH="$isolated_path" HOME="$isolated_home" /bin/bash -c '
            set -euo pipefail
            test -z "${JAVA_HOME:-}"
            test "$(command -v java)" = "/usr/local/bin/java"
            test "$(command -v javac)" = "/usr/local/bin/javac"
            test "$(command -v jar)" = "/usr/local/bin/jar"
            test "$(command -v mvn)" = "/usr/local/bin/mvn"
          '
          java_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" java -version 2>&1)"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.+_-]|")'
          maven_version="$(env -i PATH="$isolated_path" HOME="$isolated_home" mvn -v 2>&1)"
          printf '%s\n' "$maven_version" | grep -Eq 'Apache Maven '
          printf '%s\n' "$maven_version" | grep -Eq 'Java version: 21([.+_-]|[, ]|$)'
          echo "EX3_ISOLATED_JAVA21_AND_MAVEN_PASS"

      - name: Install Worker from exact vendored source with clean checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/lf-worker-pilot"
          # Build/install from a private copy; pip cannot modify tracked source.
          cp -a "$GITHUB_WORKSPACE/source/vendor/programming-agent" \
            "$RUNNER_TEMP/lf-worker-pilot/worker-install-src"
          python3 -m pip install --no-input --disable-pip-version-check \
            --no-cache-dir "$RUNNER_TEMP/lf-worker-pilot/worker-install-src"

      - name: Decode exercise-1 holdout from its OWN base64 secret (no fallback)
        if: ${{ inputs.task == 'exercise-1' }}
        shell: bash
        env:
          PILOT_HOLDOUT_B64: ${{ secrets.PILOT_HOLDOUT_B64 }}
          PILOT_HOLDOUT_EXPECTED_SHA: ${{ steps.task_sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          encoded=os.environ.get("PILOT_HOLDOUT_B64")
          if not encoded:
              raise SystemExit("PILOT_HOLDOUT_B64_MISSING")
          try:
              raw=base64.b64decode(encoded,validate=True)
          except (ValueError,base64.binascii.Error):
              raise SystemExit("PILOT_HOLDOUT_BASE64_INVALID")
          expected=os.environ.get("PILOT_HOLDOUT_EXPECTED_SHA", "")
          if len(expected)!=64 or any(c not in "0123456789abcdef" for c in expected):
              raise SystemExit("PILOT_HOLDOUT_SHA_UNREGISTERED")
          if hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit("HIDDEN_HOLDOUT_SHA_MISMATCH")
          path=Path(os.environ["RUNNER_TEMP"])/"lf-worker-pilot"/"holdout.oracle.json"
          with path.open("xb") as handle:
              handle.write(raw)
          path.chmod(0o600)
          PY


      - name: Decode exercise-2 holdout from its OWN base64 secret (no fallback)
        if: ${{ inputs.task == 'exercise-2' }}
        shell: bash
        env:
          PILOT_HOLDOUT_B64: ${{ secrets.PILOT_HOLDOUT_EX2_B64 }}
          PILOT_HOLDOUT_EXPECTED_SHA: ${{ steps.task_sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          encoded=os.environ.get("PILOT_HOLDOUT_B64")
          if not encoded:
              raise SystemExit("PILOT_HOLDOUT_B64_MISSING")
          try:
              raw=base64.b64decode(encoded,validate=True)
          except (ValueError,base64.binascii.Error):
              raise SystemExit("PILOT_HOLDOUT_BASE64_INVALID")
          expected=os.environ.get("PILOT_HOLDOUT_EXPECTED_SHA", "")
          if len(expected)!=64 or any(c not in "0123456789abcdef" for c in expected):
              raise SystemExit("PILOT_HOLDOUT_SHA_UNREGISTERED")
          if hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit("HIDDEN_HOLDOUT_SHA_MISMATCH")
          path=Path(os.environ["RUNNER_TEMP"])/"lf-worker-pilot"/"holdout.oracle.json"
          with path.open("xb") as handle:
              handle.write(raw)
          path.chmod(0o600)
          PY


      - name: Decode exercise-3 holdout from its OWN base64 secret (no fallback)
        if: ${{ inputs.task == 'exercise-3' }}
        shell: bash
        env:
          PILOT_HOLDOUT_B64: ${{ secrets.PILOT_HOLDOUT_EX3_B64 }}
          PILOT_HOLDOUT_EXPECTED_SHA: ${{ steps.task_sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          encoded=os.environ.get("PILOT_HOLDOUT_B64")
          expected=os.environ.get("PILOT_HOLDOUT_EXPECTED_SHA","")
          if not encoded or len(expected)!=64 or any(c not in "0123456789abcdef" for c in expected):
              raise SystemExit("PILOT_EX3_HOLDOUT_SHA_OR_SECRET_MISSING")
          try:
              raw=base64.b64decode(encoded,validate=True)
          except (ValueError,base64.binascii.Error):
              raise SystemExit("PILOT_EX3_HOLDOUT_BASE64_INVALID")
          if hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit("PILOT_EX3_HOLDOUT_SHA_MISMATCH")
          path=Path(os.environ["RUNNER_TEMP"])/"lf-worker-pilot"/"holdout.oracle.json"
          with path.open("xb") as handle:
              handle.write(raw)
          path.chmod(0o600)
          PY

      - name: Offline WorkerTaskSpec preflight, source/holdout/cost-adapter verification
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 source/pilot/worker_v08/run_live_pilot.py prepare \
            --private "$RUNNER_TEMP/lf-worker-pilot"

      - name: Conservative pre-model budget gate (no API call if exceeded)
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          python3 source/pilot/worker_v08/budget_gate.py \
            --model "$PILOT_MODEL" \
            --attempts "$PILOT_MAX_ATTEMPTS" \
            --task "$PILOT_TASK"

      - name: Execute REAL vendored run_verified_worker (max 3 attempts; max output 8000)
        id: worker
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python3 source/pilot/worker_v08/run_live_pilot.py execute \
            --private "$RUNNER_TEMP/lf-worker-pilot"

      - name: Mandatory actual-usage model-specific USD cost gate (fail closed)
        id: cost
        if: always() && steps.worker.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python3 source/pilot/worker_v08/run_live_pilot.py cost \
            --private "$RUNNER_TEMP/lf-worker-pilot"

      - name: Write sanitized status log, never secret or holdout
        if: always()
        shell: bash
        env:
          VENDOR_STATUS: ${{ steps.vendor.outcome }}
          PREP_STATUS: ${{ steps.preflight.outcome }}
          WORKER_STATUS: ${{ steps.worker.outcome }}
          COST_STATUS: ${{ steps.cost.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          directory=Path(os.environ["RUNNER_TEMP"])/"lf-worker-pilot"/"public"
          directory.mkdir(parents=True,exist_ok=True)
          log="VENDOR="+os.getenv("VENDOR_STATUS","not-run")+"\n"
          log+="PREFLIGHT="+os.getenv("PREP_STATUS","not-run")+"\n"
          log+="WORKER="+os.getenv("WORKER_STATUS","not-run")+"\n"
          log+="COST="+os.getenv("COST_STATUS","not-run")+"\n"
          log+="QUALITY_CLI_NOT_USED=true\n"
          log+="RUN_VERIFIED_WORKER=true\nPG07_ADMITTED=false\n"
          log+="SECRETS_NOT_LOGGED=true\nHOLDOUT_NOT_UPLOADED=true\n"
          (directory/"pilot-status.log").write_text(log,encoding="utf-8")
          PY

      - name: Upload sealed receipts, cost and sanitized logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, SHA pinned
        with:
          name: worker-pilot-receipts-cost-logs
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/lf-worker-pilot/public/verified-worker-receipt.json
            ${{ runner.temp }}/lf-worker-pilot/public/visible-worker-receipt.json
            ${{ runner.temp }}/lf-worker-pilot/public/cost.json
            ${{ runner.temp }}/lf-worker-pilot/public/pilot-summary.log
            ${{ runner.temp }}/lf-worker-pilot/public/pilot-status.log

      - name: Upload patch ONLY if verified PASS and cost gate PASS
        if: ${{ steps.worker.outcome == 'success' && steps.cost.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, SHA pinned
        with:
          name: worker-pilot-verified-patch
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/lf-worker-pilot/public/worker.patch

      - name: Build isolated executable time-service JAR only on verified PASS and cost PASS
        if: ${{ inputs.task == 'exercise-3' && steps.worker.outcome == 'success' && steps.cost.outcome == 'success' }}
        id: ex3_jar
        shell: bash
        run: |
          set -euo pipefail
          python3 source/pilot/worker_v08/build_time_service_jar.py

      - name: Upload exercise-3 executable JAR ONLY on verified PASS, cost PASS and build PASS
        if: ${{ inputs.task == 'exercise-3' && steps.worker.outcome == 'success' && steps.cost.outcome == 'success' && steps.ex3_jar.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 SHA pinned
        with:
          name: time-service.jar
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/lf-worker-pilot/public/time-service.jar
